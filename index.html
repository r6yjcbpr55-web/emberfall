 {n:"COMMON",   c:"#5FA85E",spin:620,step:170},
 {n:"RARE",     c:"#3E86D6",spin:820,step:230},
 {n:"EPIC",     c:"#9B5FD0",spin:1080,step:300},
 {n:"LEGENDARY",c:"#E8A22B",spin:1450,step:390}
];
let spinTimer=null;
function rollTier(boost){
  const lv=P.level, st=B.stage;
  const w=[60-lv*0.8-st*0.25, 26+lv*0.2, 9+lv*0.35+st*0.12, 1.2+lv*0.18+st*0.06];
  let tot=0;w.forEach((x,i)=>{w[i]=Math.max(1,x);tot+=w[i];});
  const roll=()=>{let r=Math.random()*tot;
    for(let i=0;i<4;i++){r-=w[i];if(r<=0)return i;}return 0;};
  /* angels roll twice and keep the better result */
  let t=boost?Math.max(roll(),roll()):roll();
  /* never two legendaries in a row */
  if(t===3&&B.lastTier===3)t=2;
  B.lastTier=t;
  return t;
}
function tierPool(t){
  const c={};P.boons.forEach(b=>c[b]=(c[b]||0)+1);
  return BOONS.filter(b=>b.r===t&&(c[b.id]||0)<b.max);
}
const BBY={};BOONS.forEach(b=>BBY[b.id]=b);
function openPause(){
  B.paused=true;
  const tc=["#5FA85E","#3E86D6","#9B5FD0","#E8A22B"];
  $("pInfo").textContent="Stage "+B.stage+" · Room "+B.room+" / "+B.rooms+
    " · Level "+P.level+" · "+P.boons.length+" boons";
  const box=$("pBoons");box.innerHTML="";
  const counts={},order=[];
  P.boons.forEach(id=>{if(!counts[id]){counts[id]=0;order.push(id);}counts[id]++;});
  if(!order.length){
    box.innerHTML='<div class="mut" style="text-align:center;padding:12px">'+
      'No boons yet. Level up to earn your first.</div>';
  }
  order.forEach(id=>{
    const b=BBY[id];if(!b)return;
    const el=document.createElement("div");el.className="pb";
    el.style.borderLeftColor=tc[b.r];
    el.innerHTML='<div class="pg" style="color:'+tc[b.r]+'">'+b.g+'</div>'+
      '<div style="flex:1"><div class="pn">'+b.n+'</div>'+
      '<div class="pd">'+b.d+'</div></div>'+
      (counts[id]>1?'<div class="px">×'+counts[id]+'</div>':'');
    box.appendChild(el);
  });
  $("oPause").classList.add("on");
}
function showBoons(angel){
  B.paused=true;saveNow();
  let tier=rollTier(angel);
  let pool=tierPool(tier);
  const need=angel?2:3;
  let guard=0;
  while(pool.length<need&&guard++<4){tier=(tier+3)%4;pool=tierPool(tier);}
  if(pool.length<need){
    const all=[];for(let t=0;t<4;t++)all.push.apply(all,tierPool(t));
    pool=all;
  }
  const picks=offer(pool,angel?2:3);
  const T=BTIER[tier];
  const ovl=$("oBoon"),box=$("boonBox");
  ovl.classList.add("on");
  ovl.style.setProperty("--tc",T.c);
  ovl.className="ovl on tier"+tier;
  $("boonRank").textContent=(angel?"GOLDEN ANGEL · ":"")+T.n+" BOON";
  $("boonRank").style.color=T.c;
  $("boonTitle").textContent=angel?"A gift, freely given":"Level "+P.level;
  $("boonHint").textContent="";
  box.innerHTML="";
  const rows=picks.map(()=>{
    const el=document.createElement("div");
    el.className="boon spin";el.style.borderLeftColor=T.c;
    el.innerHTML='<div class="gl" style="color:'+T.c+'">?</div>'+
      '<div style="flex:1"><div class="bn">&nbsp;</div><div class="bd">&nbsp;</div></div>';
    box.appendChild(el);return el;
  });
  const paint=(el,b)=>{
    el.querySelector(".gl").textContent=b.g;
    el.querySelector(".bn").textContent=b.n;
    el.querySelector(".bd").textContent=b.d;
  };
  let locked=0;
  clearInterval(spinTimer);
  spinTimer=setInterval(()=>{
    for(let i=locked;i<rows.length;i++)paint(rows[i],pick(pool));
  },62);
  picks.forEach((b,i)=>{
    setTimeout(()=>{
      locked=i+1;paint(rows[i],b);
      rows[i].classList.remove("spin");rows[i].classList.add("lock");
      if(i===rows.length-1){
        clearInterval(spinTimer);spinTimer=null;
        $("boonHint").textContent="Choose one";
        rows.forEach((el,k)=>{
          el.classList.add("ready");
          el.onclick=()=>{
            if(spinTimer)return;
            picks[k].f(P);P.boons.push(picks[k].id);
            P.boonSrc.push(angel?1:0);
            ovl.classList.remove("on");
            if(P.pending>0){P.pending--;setTimeout(()=>showBoons(false),220);}
            else advanceRoom();
          };
        });
      }
    },T.spin+i*T.step);
  });
}
function offer(pool,howMany){
  const c={};P.boons.forEach(b=>c[b]=(c[b]||0)+1);
  const src=pool.slice();
  const out=[];
  while(out.length<(howMany||3)&&src.length){
    let tot=0;
    const wts=src.map(b=>{
      /* each copy you already own halves how often it shows up again */
      const w=b.w/Math.pow(2,c[b.id]||0);tot+=w;return w;});
    let r=Math.random()*tot,x=0;
    for(let i=0;i<src.length;i++){r-=wts[i];if(r<=0){x=i;break;}}
    out.push(src[x]);src.splice(x,1);
  }
  return out;
}
function rollRarity(){
  const s=B.stage;
  /* nothing above Epic ever drops - Mythic and Chaotic are forged */
  const w=[
    Math.max(2,40-s*1.2),        /* common */
    Math.max(4,30-s*0.4),        /* good */
    10+s*0.5,                    /* rare */
    Math.max(0,s-5)*0.72,        /* epic */
    Math.max(0,s-13)*0.34,       /* legendary */
    0,                           /* mythic - forge only */
    0                            /* chaotic - forge only */
  ];
  let t=0;w.forEach(x=>t+=x);let r=Math.random()*t;
  for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i;}
  return 0;
}
function rollDrop(){
  let r=rollRarity();
  let pool;
  if(r>=5)r=4;
  if(false)pool=[];
  else pool=GEAR.filter(g=>g.minR<=r&&g.maxR>=r&&!g.sOnly&&
    CHAOTIC.indexOf(g.id)<0).map(g=>g.id);
  if(!pool.length){r=clamp(r,0,4);
    pool=GEAR.filter(g=>g.minR<=r&&g.maxR>=r&&!g.sOnly&&
      CHAOTIC.indexOf(g.id)<0).map(g=>g.id);}
  return addItem(pick(pool),r);
}
function rollSPiece(rar){
  const all=[];for(const k in SET_PIECES)all.push.apply(all,SET_PIECES[k]);
  return addItem(pick(all),rar===undefined?3:rar);
}
function finish(won){
  B.on=false;B.paused=true;
  const drops=[],dropRunes=[];
  if(B.mode==='rush'){
    const beaten=won?5:B.room-1;
    const T=B.tier||1;
    S.rushBest=Math.max(S.rushBest||0,beaten);
    if(won){
      S.rushClear=Math.max(S.rushClear||0,T);
      S.rushTier=clamp(Math.max(S.rushTier||1,T+1),1,10);
    }
    const g=Math.round(500*beaten*T);
    const sf=Math.round(35*beaten*(1+T*0.35));
    addPlayerXP(Math.round(150*beaten*T*0.5));
    S.gold+=g;S.soul+=sf;
    if(beaten>=3)drops.push(rollDrop());
    if(beaten>=5){
      const sp=rollSPiece(3);sp.nw=1;drops.push(sp);
      toast("S-TIER: "+GBY[sp.id].n);
      S.gem+=30;
      const rr=Math.max(2,Math.min(4,rollRarity()));
      dropRunes.push(addRune(pick(RUNES).id,rr));}
    $("endTitle").textContent=won?"Trial complete":"Trial ended";
    $("endTitle").style.color=won?"var(--gold)":"var(--blood)";
    $("endSub").textContent="Tier "+T+"  ·  "+beaten+" of 5 wardens felled";
    $("endLoot").textContent="+"+fmt(g)+" gold  ·  +"+sf+" soulfire"+
      (beaten>=5?"  ·  +30 gems":"");
    $("endNext").style.display="";
    $("endNext").textContent=won&&T<10?"Tier "+(T+1):"Tier "+T+" again";
    B.nextTier=won&&T<10?T+1:T;
    const db0=$("drops");db0.innerHTML="";
    drops.forEach(it=>it.nw=1);dropRunes.forEach(rn=>rn.nw=1);
    drops.forEach(it=>{const el=document.createElement("div");el.className="it";
      el.style.borderColor=RAR[it.r].c;el.appendChild(iconEl(it,30));
      el.onclick=()=>openItem(it);db0.appendChild(el);});
    dropRunes.forEach(rn=>{const el=document.createElement("div");el.className="it";
      el.style.borderColor=RAR[rn.r].c;el.appendChild(runeEl(rn,30));
      el.onclick=()=>openRune(rn,null);db0.appendChild(el);});
    save();renderTop();renderStages();renderRunes();refreshScene();markTabs();
    $("oEnd").classList.add("on");B.lastWon=won;B.lastRush=true;
    return;
  }
  B.lastRush=false;
  if(won){
    const n=(B.stage%10===0?1:0)+(Math.random()<.55?1:0)+(Math.random()<.25?1:0);
    for(let i=0;i<n;i++)drops.push(rollDrop());
    if(B.stage%10===0&&Math.random()<0.20){
      const sp=rollSPiece(3);sp.nw=1;drops.push(sp);
      toast("S-TIER: "+GBY[sp.id].n);
    }
    if(Math.random()<(B.stage%10===0?0.9:0.35)){
      const rr=Math.min(4,rollRarity());
      dropRunes.push(addRune(pick(RUNES).id,rr));
    }
    const hpFrac=P.hp/P.maxhp;
    const stars=hpFrac>.7?3:hpFrac>.3?2:1;
    S.best[B.stage]=Math.max(S.best[B.stage]||0,stars);
    if(B.stage>=S.stage){S.stage=Math.min(STAGES,B.stage+1);S.newStage=S.stage;}
    S.gold+=B.gold+B.stage*44;
    S.soul+=Math.round(8+B.stage*1.8);
    S.gem+=B.stage%10===0?20:0;
    S.rank=1+Math.floor(Object.keys(S.best).length/3);
    const pg=addPlayerXP(Math.round(60+B.stage*22+B.kills*1.5));
    if(pg)toast("Level "+S.plv+"!");
    $("endTitle").textContent="Stage "+B.stage+" cleared";
    $("endTitle").style.color="var(--gold)";
    $("endSub").textContent="★".repeat(stars)+"☆".repeat(3-stars)+
      "  ·  "+B.kills+" slain"+(B.eliteKills?"  ·  "+B.eliteKills+" elite":"")+
      "  ·  "+Math.round(hpFrac*100)+"% health left";
    $("endLoot").textContent="+"+fmt(B.gold+B.stage*44)+" gold  ·  +"+
      Math.round(8+B.stage*1.8)+" soulfire"+(B.stage%10===0?"  ·  +20 gems":"");
    $("endNext").style.display=B.stage<STAGES?"":"none";
    $("endNext").textContent="Stage "+(B.stage+1);
  }else{
    S.gold+=Math.round(B.gold*.5);S.soul+=Math.round(B.stage*.5);
    $("endTitle").textContent="You fall";
    $("endTitle").style.color="var(--blood)";
    $("endSub").textContent="Room "+B.room+" of "+B.rooms+"  ·  "+B.kills+" slain";
    $("endLoot").textContent="+"+fmt(Math.round(B.gold*.5))+" gold recovered";
    $("endNext").style.display="";$("endNext").textContent="Retry";
  }
  const db=$("drops");db.innerHTML="";
  drops.forEach(it=>{
    const el=document.createElement("div");el.className="it";
    el.style.borderColor=RAR[it.r].c;el.appendChild(iconEl(it,30));
    el.onclick=()=>openItem(it);db.appendChild(el);
    if(it.r>=5)toast(RAR[it.r].n+"! "+GBY[it.id].n);
  });
  if(dropRunes.length)toast("Rune found: "+RBY[dropRunes[0].id].n);
  dropRunes.forEach(rn=>{
    const el=document.createElement("div");el.className="it";
    el.style.borderColor=RAR[rn.r].c;el.appendChild(runeEl(rn,30));
    el.onclick=()=>openRune(rn,null);db.appendChild(el);
  });
  drops.forEach(it=>it.nw=1);dropRunes.forEach(rn=>rn.nw=1);
  save();renderTop();renderStages();renderRunes();refreshScene();markTabs();
  $("oEnd").classList.add("on");
  B.lastWon=won;
}
$("endBack").onclick=()=>{$("oEnd").classList.remove("on");endBattle();renderStages();};
$("endNext").onclick=()=>{$("oEnd").classList.remove("on");
  if(B.lastRush){startRush(B.nextTier||1);return;}
  startStage(B.lastWon?Math.min(STAGES,B.stage+1):B.stage);};
$("pResume").onclick=()=>{$("oPause").classList.remove("on");
  if(!$("oBoon").classList.contains("on"))B.paused=false;};
$("pQuit").onclick=()=>{$("oPause").classList.remove("on");endBattle();renderStages();};

/* --- render --- */
function draw(){
  ctx.clearRect(0,0,W,H);
  if(!B.on&&!P){ctx.fillStyle="#0E0C14";ctx.fillRect(0,0,W,H);return;}
  const bio=B.bio;
  const sx=B.shake?Math.sin(B.t*53)*B.shake*.42:0,
        sy=B.shake?Math.cos(B.t*47)*B.shake*.34:0;
  ctx.save();ctx.translate(sx,sy);
  /* floor: lifted base, chequered tiles, and a warm pool of light at the centre */
  ctx.fillStyle=shade(bio.floor,.16);ctx.fillRect(0,0,W,H);
  const TS=30;
  for(let gx=0;gx<W;gx+=TS)for(let gy=TOP;gy<H;gy+=TS){
    if(((gx/TS)+Math.floor((gy-TOP)/TS))%2===0){
      ctx.fillStyle=shade(bio.grid,.10);ctx.fillRect(gx,gy,TS,TS);}
  }
  ctx.strokeStyle=shade(bio.grid,.28);ctx.lineWidth=1;
  for(let x=0;x<W;x+=TS){ctx.beginPath();ctx.moveTo(x+.5,TOP);ctx.lineTo(x+.5,H);ctx.stroke();}
  for(let y=TOP;y<H;y+=TS){ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5);ctx.stroke();}
  const lg=ctx.createRadialGradient(W/2,(TOP+H)/2,40,W/2,(TOP+H)/2,H*0.62);
  lg.addColorStop(0,"rgba(255,240,215,.10)");
  lg.addColorStop(.55,"rgba(255,240,215,.03)");
  lg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=lg;ctx.fillRect(0,TOP,W,H-TOP);
  ctx.strokeStyle=bio.edge;ctx.lineWidth=3;ctx.strokeRect(4,TOP+4,W-8,H-TOP-8);
  ctx.save();ctx.globalAlpha=.5;
  for(const d of B.decor){
    ctx.fillStyle=shade(bio.grid,.22);
    if(d.k){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.a);
      ctx.fillRect(-d.s*2,-.6,d.s*4,1.2);ctx.restore();}
    else{ctx.beginPath();ctx.arc(d.x,d.y,d.s*.7,0,6.283);ctx.fill();}
  }
  ctx.restore();
  for(const f of B.fires){
    ctx.globalAlpha=clamp(f.l/2.2,0,1)*.55;
    ctx.fillStyle=f.acid?"#8FBF6A":"#E0703A";
    ctx.beginPath();ctx.arc(f.x,f.y,f.r*(0.6+0.4*Math.sin(B.t*7+f.x)),0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;

  const D=dressOf();
  /* border framing: thick stone edge with biome trim */
  ctx.fillStyle=D.wallSide;
  ctx.fillRect(0,TOP,W,10);ctx.fillRect(0,H-8,W,8);
  ctx.fillRect(0,TOP,8,H);ctx.fillRect(W-8,TOP,8,H);
  ctx.fillStyle=D.wallTop;
  ctx.fillRect(0,TOP,W,6);ctx.fillRect(0,TOP,5,H);ctx.fillRect(W-5,TOP,5,H);
  ctx.fillStyle=D.trim;
  for(let x=4;x<W;x+=26)ctx.fillRect(x,TOP+1,13,3);
  ctx.strokeStyle=bio.edge;ctx.lineWidth=1.5;ctx.strokeRect(8.5,TOP+9.5,W-17,H-TOP-18);

  /* scenery */
  for(const pr of B.props)drawProp(pr,D);

  /* obstacles as raised blocks with a lit top face and a cast shadow */
  for(const w of B.walls){
    const lift=9;
    ctx.fillStyle="rgba(0,0,0,.42)";
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(w.x+5,w.y+6,w.w,w.h,4);
    else ctx.rect(w.x+5,w.y+6,w.w,w.h);
    ctx.fill();
    ctx.fillStyle=D.wallSide;
    ctx.fillRect(w.x,w.y+w.h-lift,w.w,lift+4);
    ctx.fillStyle=D.wallTop;
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(w.x,w.y-lift,w.w,w.h,4);
    else ctx.rect(w.x,w.y-lift,w.w,w.h);
    ctx.fill();
    ctx.fillStyle=shade(D.wallTop,.16);
    ctx.fillRect(w.x+3,w.y-lift+3,w.w-6,3);
    ctx.strokeStyle=D.trim;ctx.lineWidth=1.6;
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(w.x,w.y-lift,w.w,w.h,4);
    else ctx.rect(w.x,w.y-lift,w.w,w.h);
    ctx.stroke();
    ctx.fillStyle="rgba(0,0,0,.22)";
    for(let bx=w.x+6;bx<w.x+w.w-6;bx+=15)ctx.fillRect(bx,w.y-lift+9,1.5,w.h-16);
  }

  /* drifting ambience */
  for(const m of B.amb){
    m.y-=m.v*0.016;m.x+=Math.sin(B.t*0.7+m.p)*0.25+m.d*0.004;
    if(m.y<TOP-4){m.y=H+4;m.x=rnd(0,W);}
    if(m.x<-4)m.x=W+4;if(m.x>W+4)m.x=-4;
    const a=.18+Math.sin(B.t*2+m.p)*.14;
    if(D.amb==="snow"){ctx.globalAlpha=a+.2;ctx.fillStyle="#DCEEFF";
      ctx.beginPath();ctx.arc(m.x,m.y+B.t*12%H,m.s*.8,0,6.283);ctx.fill();}
    else{ctx.globalAlpha=a;ctx.fillStyle=D.glow;ctx.fillRect(m.x,m.y,m.s,m.s);}
  }
  ctx.globalAlpha=1;
  for(const h of B.haz)drawHaz(h);
  for(const t of B.tels){
    const k=1-t.t/t.max;
    ctx.globalAlpha=.20+k*.35;ctx.fillStyle=t.col;
    ctx.beginPath();ctx.arc(t.x,t.y,t.r*k,0,6.283);ctx.fill();
    ctx.globalAlpha=.85;ctx.strokeStyle=t.col;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,6.283);ctx.stroke();
    ctx.globalAlpha=1;
  }
  for(const o of B.orbs){
    const pu=1+Math.sin(B.t*6+o.x*.1)*.14;
    if(o.heart){
      ctx.save();ctx.translate(o.x,o.y);ctx.scale(pu,pu);
      ctx.fillStyle="#F06A80";ctx.beginPath();
      ctx.moveTo(0,4.5);ctx.bezierCurveTo(-7,-1,-4,-6.5,0,-3);
      ctx.bezierCurveTo(4,-6.5,7,-1,0,4.5);ctx.fill();
      ctx.strokeStyle="#3A0E16";ctx.lineWidth=1.4;ctx.stroke();
      ctx.restore();
    }else if(o.xp){
      ctx.fillStyle="rgba(111,175,140,.28)";
      ctx.beginPath();ctx.arc(o.x,o.y,6.5*pu,0,6.283);ctx.fill();
      ctx.fillStyle="#9FE1CB";
      ctx.beginPath();
      for(let k=0;k<4;k++){const a=k/4*6.283+B.t*2,rr=k%2?1.8:4.2;
        k?ctx.lineTo(o.x+Math.cos(a)*rr,o.y+Math.sin(a)*rr):
          ctx.moveTo(o.x+Math.cos(a)*rr,o.y+Math.sin(a)*rr);}
      ctx.closePath();ctx.fill();
    }else{
      ctx.fillStyle="#E8B04B";ctx.beginPath();ctx.arc(o.x,o.y,3.4*pu,0,6.283);ctx.fill();
      ctx.strokeStyle="#FFE9A8";ctx.lineWidth=1;ctx.stroke();
    }
  }
  for(const s of B.eshots){
    if(s.kind==="lobshadow")continue;
    if(s.kind==="axe"){
      ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.spin);
      ctx.fillStyle="#6A5230";ctx.fillRect(-1.8,-9,3.6,18);
      ctx.fillStyle="#C8CBD4";
      ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(9,-6);ctx.lineTo(9,1);ctx.lineTo(0,-2);
      ctx.closePath();ctx.fill();
      ctx.strokeStyle="#0B0912";ctx.lineWidth=1.6;ctx.stroke();
      ctx.restore();continue;
    }
    if(s.kind==="tornado"){
      ctx.save();ctx.translate(s.x,s.y);
      for(let k=0;k<3;k++){
        const rr=s.r*(1-k*0.24), off=s.spin*(1+k*.5);
        ctx.strokeStyle="rgba(159,215,255,"+(0.5-k*0.1)+")";ctx.lineWidth=2.4;
        ctx.beginPath();ctx.arc(0,-k*5,rr,off,off+4.4);ctx.stroke();
      }
      ctx.restore();continue;
    }
    const pulse=1+Math.sin(s.t*16)*0.1;
    ctx.fillStyle="#C0364B";
    ctx.beginPath();ctx.arc(s.x,s.y,s.r*pulse,0,6.283);ctx.fill();
    ctx.strokeStyle="#F0808F";ctx.lineWidth=1.4;ctx.stroke();
    ctx.fillStyle="rgba(255,220,220,.55)";
    ctx.beginPath();ctx.arc(s.x-s.r*.3,s.y-s.r*.3,s.r*.32,0,6.283);ctx.fill();
  }
  for(const L of B.lasers){
    const k=Math.min(1,L.l/L.max*1.5);
    const outer=L.el?L.el.c:(L.crit?"#FFD27A":"#9FE8FF");
    const inner=L.el?L.el.g:"#FFFFFF";
    ctx.save();ctx.lineCap="round";ctx.lineJoin="round";
    const path=()=>{ctx.beginPath();ctx.moveTo(L.pts[0].x,L.pts[0].y);
      for(let i=1;i<L.pts.length;i++)ctx.lineTo(L.pts[i].x,L.pts[i].y);};
    ctx.globalAlpha=k*.30;ctx.strokeStyle=outer;ctx.lineWidth=L.w*3.4*k;
    path();ctx.stroke();
    ctx.globalAlpha=k*.75;ctx.strokeStyle=outer;ctx.lineWidth=L.w*1.7*k;
    path();ctx.stroke();
    ctx.globalAlpha=k;ctx.strokeStyle=inner;ctx.lineWidth=L.w*0.62*k;
    path();ctx.stroke();
    if(L.el){
      ctx.globalAlpha=k*.9;
      for(let i=6;i<L.pts.length;i+=14){
        const q=L.pts[i];
        elemMark(ctx,L.el.k,q.x,q.y,4.2,B.t+i);
      }
    }
    ctx.restore();ctx.globalAlpha=1;
  }
  for(const b of B.beams){
    const L=900;
    if(b.t<b.warn){
      const k=b.t/b.warn;
      ctx.save();ctx.globalAlpha=.25+k*.5;
      ctx.strokeStyle="#FF7A8A";ctx.lineWidth=1.5+k*2.5;
      ctx.setLineDash([9,7]);ctx.beginPath();
      ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+Math.cos(b.a)*L,b.y+Math.sin(b.a)*L);
      ctx.stroke();ctx.setLineDash([]);ctx.restore();
    }else{
      const k=1-(b.t-b.warn)/b.fire;
      ctx.save();ctx.globalAlpha=k;
      ctx.strokeStyle="#FFD9DE";ctx.lineWidth=26*k;ctx.globalAlpha=k*.35;
      ctx.beginPath();ctx.moveTo(b.x,b.y);
      ctx.lineTo(b.x+Math.cos(b.a)*L,b.y+Math.sin(b.a)*L);ctx.stroke();
      ctx.globalAlpha=k;ctx.strokeStyle="#FFFFFF";ctx.lineWidth=9*k;
      ctx.beginPath();ctx.moveTo(b.x,b.y);
      ctx.lineTo(b.x+Math.cos(b.a)*L,b.y+Math.sin(b.a)*L);ctx.stroke();
      ctx.restore();
    }
  }
  for(const c of B.corpses){
    const k=c.l/c.max;
    ctx.globalAlpha=k;ctx.save();ctx.translate(c.x,c.y);
    ctx.scale(1+(1-k)*0.9,(1-k)*0.35+k);
    ctx.fillStyle=c.col;ctx.beginPath();ctx.arc(0,0,c.r,0,6.283);ctx.fill();
    ctx.restore();ctx.globalAlpha=1;
  }
  for(const e of B.enemies)drawEnemy(e);
  for(const pet of B.pets)if(!pet.dead)wolfSprite(ctx,pet.x,pet.y,1,B.t);

  /* melee arcs */
  for(const s of B.swings){
    const k=s.t/s.life;
    ctx.save();ctx.translate(P.x,P.y);
    const EA=P?elemOf():null;
    ctx.strokeStyle=EA?EA.c:"rgba(255,245,220,"+(1-k)*.85+")";
    ctx.globalAlpha=EA?(1-k)*.85:1;
    ctx.lineWidth=8*(1-k*.5)*P.size;ctx.lineCap="round";
    ctx.beginPath();ctx.arc(0,0,s.r*(.55+k*.45),s.a-1.15,s.a+1.15);ctx.stroke();
    ctx.globalAlpha=1;ctx.restore();
  }
  if(B.angel&&!B.angel.taken){
    const A=B.angel,fl=Math.sin(A.t*2)*4;
    ctx.save();ctx.translate(A.x,A.y+fl);
    const gg=ctx.createRadialGradient(0,0,4,0,0,86);
    gg.addColorStop(0,"rgba(232,176,75,.34)");
    gg.addColorStop(1,"rgba(232,176,75,0)");
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(0,0,86,0,6.283);ctx.fill();
    ctx.strokeStyle="rgba(232,176,75,.55)";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,34+Math.sin(A.t*3)*3,0,6.283);ctx.stroke();
    /* wings */
    ctx.fillStyle="#F5EAD2";ctx.strokeStyle="#0B0912";ctx.lineWidth=2;
    for(const d of [-1,1]){
      ctx.save();ctx.scale(d,1);ctx.rotate(Math.sin(A.t*2.4)*0.10);
      ctx.beginPath();ctx.moveTo(4,-8);
      ctx.quadraticCurveTo(30,-30,34,2);
      ctx.quadraticCurveTo(22,-4,16,14);
      ctx.quadraticCurveTo(14,-2,4,4);ctx.closePath();
      ctx.fill();ctx.stroke();ctx.restore();
    }
    /* robed body */
    ctx.fillStyle="#EFE7D2";
    ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(10,16);ctx.lineTo(-10,16);
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle="#F5EAD2";
    ctx.beginPath();ctx.arc(0,-15,8,0,6.283);ctx.fill();ctx.stroke();
    /* halo */
    ctx.strokeStyle="#E8B04B";ctx.lineWidth=2.6;
    ctx.beginPath();ctx.ellipse(0,-27,9,3,0,0,6.283);ctx.stroke();
    ctx.restore();
    ctx.fillStyle="#E8B04B";ctx.font='700 10px "Space Grotesk",sans-serif';
    ctx.textAlign="center";
    ctx.globalAlpha=.65+Math.sin(A.t*4)*.3;
    ctx.fillText("STEP CLOSE",A.x,A.y+62);
    ctx.globalAlpha=1;ctx.textAlign="left";
  }
  if(P)drawPlayer();

  for(const s of B.shots){
    const grow=Math.min(1,(s.t||0)*14+0.35);
    if(s.tr&&s.tr.length>3){
      ctx.strokeStyle=s.crit?"rgba(255,210,122,.45)":"rgba(239,231,210,.32)";
      ctx.lineWidth=s.r*1.1;ctx.lineCap="round";ctx.beginPath();
      ctx.moveTo(s.tr[0],s.tr[1]);
      for(let k=2;k<s.tr.length;k+=2)ctx.lineTo(s.tr[k],s.tr[k+1]);
      ctx.stroke();
    }
    const a=Math.atan2(s.vy,s.vx);
    const EL=P?elemOf():null;
    if(EL)elemMark(ctx,EL.k,s.x,s.y,s.r*1.15,B.t+s.x*0.05);
    ctx.save();ctx.translate(s.x,s.y);ctx.scale(grow,grow);
    if(s.kind==="staff"||s.kind==="mote"){
      ctx.fillStyle=s.kind==="mote"?"#9FE1CB":(EL?EL.c:bio.tint);
      ctx.beginPath();ctx.arc(0,0,s.r,0,6.283);ctx.fill();
      ctx.strokeStyle="#FFF";ctx.lineWidth=1.4;ctx.globalAlpha=.6;ctx.stroke();ctx.globalAlpha=1;
    }else if(s.kind==="chakram"){
      ctx.rotate(B.t*14);ctx.strokeStyle="#EFE7D2";ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(0,0,s.r,0,6.283);ctx.stroke();
      ctx.fillStyle=bio.tint;
      for(let i=0;i<4;i++){const q=i/4*6.283;
        ctx.beginPath();ctx.moveTo(Math.cos(q)*s.r,Math.sin(q)*s.r);
        ctx.lineTo(Math.cos(q+.35)*(s.r+5),Math.sin(q+.35)*(s.r+5));
        ctx.lineTo(Math.cos(q+.7)*s.r,Math.sin(q+.7)*s.r);ctx.closePath();ctx.fill();}
    }else if(s.kind==="spear"){
      ctx.rotate(a);ctx.fillStyle=s.crit?"#FFD27A":"#EFE7D2";
      ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(2,-s.r);ctx.lineTo(-14,-s.r*.4);
      ctx.lineTo(-14,s.r*.4);ctx.lineTo(2,s.r);ctx.closePath();ctx.fill();
    }else{
      ctx.rotate(a);ctx.fillStyle=s.crit?"#FFD27A":"#EFE7D2";
      const L=s.kind==="dagger"?9:15;
      ctx.fillRect(-L/2,-s.r*.55,L,s.r*1.1);
      ctx.fillStyle=EL?EL.c:bio.tint;ctx.fillRect(L/2-3,-s.r*.55,3,s.r*1.1);
    }
    ctx.restore();
  }
  for(const r of B.rings){
    ctx.globalAlpha=clamp(r.l*2.6,0,1)*.75;
    ctx.strokeStyle=r.col;ctx.lineWidth=2.6*(r.l*2.6);
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.283);ctx.stroke();
  }
  ctx.globalAlpha=1;
  for(const p of B.parts){
    ctx.globalAlpha=clamp(p.l*2.4,0,1);
    if(p.arc){ctx.strokeStyle=p.col;ctx.lineWidth=2.4;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x2,p.y2);ctx.stroke();}
    else{ctx.fillStyle=p.col;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);}
  }
  ctx.globalAlpha=1;ctx.textAlign="center";
  for(const t of B.texts){
    ctx.globalAlpha=clamp(t.l*1.9,0,1);ctx.fillStyle=t.col;
    const pop=1+Math.max(0,(t.l-.6))*1.6;
    ctx.save();ctx.translate(t.x,t.y);ctx.scale(pop,pop);
    ctx.lineWidth=3;ctx.strokeStyle="rgba(11,9,18,.75)";
    ctx.font=(t.big?"700 15px":"500 12px")+' "Space Grotesk",sans-serif';
    ctx.strokeText(t.t,0,0);ctx.fillText(t.t,0,0);ctx.restore();
  }
  ctx.globalAlpha=1;
  if(stick.on&&!B.paused){
    ctx.strokeStyle="rgba(239,231,210,.15)";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(stick.ox,stick.oy,44,0,6.283);ctx.stroke();
    ctx.fillStyle="rgba(239,231,210,.26)";
    ctx.beginPath();ctx.arc(stick.ox+stick.dx,stick.oy+stick.dy,15,0,6.283);ctx.fill();
  }
  ctx.restore();
  /* biome-tinted rim light instead of a flat black vignette */
  const vg=ctx.createRadialGradient(W/2,H*.55,H*.32,W/2,H*.55,H*.78);
  vg.addColorStop(0,"rgba(0,0,0,0)");
  vg.addColorStop(.75,shade(B.bio.tint,-.80)+"55");
  vg.addColorStop(1,"rgba(0,0,0,.50)");
  ctx.fillStyle=vg;ctx.fillRect(0,TOP,W,H-TOP);
  if(B.bossIntro>0){
    B.bossIntro-=1/60;
    const k=clamp(B.bossIntro/2.4,0,1);
    ctx.globalAlpha=Math.min(1,k*2.2);
    ctx.fillStyle="rgba(10,8,16,.72)";ctx.fillRect(0,H*.30,W,64);
    ctx.fillStyle=B.bio.tint;ctx.fillRect(0,H*.30,W,2);
    ctx.fillRect(0,H*.30+62,W,2);
    ctx.textAlign="center";
    ctx.fillStyle="#918AA6";ctx.font='500 9.5px "Space Grotesk",sans-serif';
    ctx.fillText(B.roomType==="elite"?"DANGER":(B.room%10===0?"WARDEN":"BOSS"),W/2,H*.30+22);
    ctx.fillStyle="#EFE7D2";ctx.font='700 20px "Cinzel",serif';
    ctx.fillText(B.bossName||"",W/2,H*.30+46);
    ctx.textAlign="left";ctx.globalAlpha=1;
  }
  drawHUD();
  if(B.flash>0){ctx.fillStyle="rgba(192,54,75,"+B.flash*.3+")";ctx.fillRect(0,0,W,H);}
}
function drawProp(p,D){
  const x=p.x,y=p.y,s=p.s,fl=1+Math.sin(B.t*7+p.p)*0.16;
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.lineWidth=1.6;ctx.strokeStyle="#0B0912";ctx.lineJoin="round";
  if(p.k==="torch"){
    ctx.fillStyle="#4A3A2A";ctx.fillRect(-2.5,-2,5,14);
    ctx.fillStyle="#E0703A";ctx.beginPath();
    ctx.moveTo(0,-16*fl);ctx.lineTo(5,-2);ctx.lineTo(-5,-2);ctx.closePath();ctx.fill();
    ctx.fillStyle="#F5C55E";ctx.beginPath();
    ctx.moveTo(0,-9*fl);ctx.lineTo(2.6,-2);ctx.lineTo(-2.6,-2);ctx.closePath();ctx.fill();
    const tg=ctx.createRadialGradient(0,-6,3,0,-6,58*fl);
    tg.addColorStop(0,"rgba(255,170,90,.30)");
    tg.addColorStop(1,"rgba(255,170,90,0)");
    ctx.fillStyle=tg;ctx.beginPath();ctx.arc(0,-6,58*fl,0,6.283);ctx.fill();
  }else if(p.k==="bones"){
    ctx.fillStyle="#C9BFA8";
    ctx.beginPath();ctx.arc(0,0,5,0,6.283);ctx.fill();ctx.stroke();
    ctx.fillStyle="#12101B";
    ctx.beginPath();ctx.arc(-1.8,-.6,1.2,0,6.283);ctx.fill();
    ctx.beginPath();ctx.arc(1.8,-.6,1.2,0,6.283);ctx.fill();
    ctx.strokeStyle="#C9BFA8";ctx.lineWidth=2.4;
    ctx.beginPath();ctx.moveTo(-9,7);ctx.lineTo(9,9);ctx.stroke();
  }else if(p.k==="bars"){
    ctx.fillStyle="#4A4256";ctx.fillRect(-11,-13,22,4);
    ctx.fillStyle="#5E5470";
    for(let i=-8;i<=8;i+=5)ctx.fillRect(i,-13,2.4,22);
  }else if(p.k==="rubble"){
    ctx.fillStyle=shade(D.wallTop,.1);
    ctx.beginPath();ctx.moveTo(-7,5);ctx.lineTo(-3,-4);ctx.lineTo(3,-2);
    ctx.lineTo(7,5);ctx.closePath();ctx.fill();ctx.stroke();
  }else if(p.k==="icicle"){
    ctx.fillStyle="#A8D8F0";ctx.globalAlpha=.85;
    ctx.beginPath();ctx.moveTo(-5,-12);ctx.lineTo(5,-12);ctx.lineTo(0,10);
    ctx.closePath();ctx.fill();ctx.globalAlpha=1;ctx.stroke();
  }else if(p.k==="crystal"){
    ctx.fillStyle="#7FC4E8";
    ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(6,-2);ctx.lineTo(3,9);
    ctx.lineTo(-3,9);ctx.lineTo(-6,-2);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.globalAlpha=.14;ctx.fillStyle="#9FD7FF";
    ctx.beginPath();ctx.arc(0,-2,26*fl,0,6.283);ctx.fill();ctx.globalAlpha=1;
  }else if(p.k==="frost"){
    ctx.strokeStyle="rgba(200,235,255,.5)";ctx.lineWidth=1.6;
    for(let i=0;i<6;i++){const a=i/6*6.283;
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(a)*9,Math.sin(a)*9);ctx.stroke();}
  }else if(p.k==="vine"){
    ctx.strokeStyle="#4C7A5E";ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(0,-16);
    for(let i=0;i<4;i++)ctx.quadraticCurveTo(6*(i%2?1:-1),-10+i*7,0,-4+i*7);
    ctx.stroke();
    ctx.fillStyle="#6FAF8C";
    for(let i=0;i<3;i++){ctx.beginPath();
      ctx.ellipse(5*(i%2?1:-1),-10+i*8,4,2.4,i,0,6.283);ctx.fill();}
  }else if(p.k==="fern"){
    ctx.strokeStyle="#5E9C74";ctx.lineWidth=2;
    for(let i=0;i<5;i++){const a=-1.57+(i-2)*0.35;
      ctx.beginPath();ctx.moveTo(0,8);
      ctx.quadraticCurveTo(Math.cos(a)*8,0,Math.cos(a)*14,Math.sin(a)*10+4);ctx.stroke();}
  }else if(p.k==="pillar"){
    ctx.fillStyle=D.wallSide;ctx.fillRect(-8,-4,16,12);
    ctx.fillStyle=D.wallTop;ctx.fillRect(-9,-20,18,16);
    ctx.strokeStyle=D.trim;ctx.lineWidth=1.6;ctx.strokeRect(-9,-20,18,16);
    ctx.fillStyle=D.trim;ctx.fillRect(-10,-22,20,3);
  }else if(p.k==="water"){
    ctx.fillStyle="rgba(80,150,140,.22)";
    ctx.beginPath();ctx.ellipse(0,0,16,8,0,0,6.283);ctx.fill();
    ctx.strokeStyle="rgba(140,220,200,.3)";ctx.lineWidth=1.2;
    ctx.beginPath();ctx.ellipse(0,0,10+Math.sin(B.t*2+p.p)*3,5,0,0,6.283);ctx.stroke();
  }else if(p.k==="thorn"){
    ctx.strokeStyle="#7A3A50";ctx.lineWidth=2.4;
    for(let i=0;i<5;i++){const a=i/5*6.283;
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(a)*11,Math.sin(a)*11);ctx.stroke();}
    ctx.fillStyle="#C0364B";ctx.beginPath();ctx.arc(0,0,3.2,0,6.283);ctx.fill();
  }else if(p.k==="tree"){
    ctx.fillStyle="#3A1F2E";ctx.fillRect(-3,-6,6,16);
    ctx.fillStyle="#5A2A3E";
    ctx.beginPath();ctx.arc(0,-12,10,0,6.283);ctx.fill();ctx.stroke();
    ctx.fillStyle="#C0364B";
    for(let i=0;i<3;i++)ctx.fillRect(-6+i*5,-15+((i*7)%6),2.4,2.4);
  }else if(p.k==="pool"){
    ctx.fillStyle="rgba(150,30,50,.28)";
    ctx.beginPath();ctx.ellipse(0,0,14,7,0,0,6.283);ctx.fill();
  }else if(p.k==="shard"){
    ctx.save();ctx.rotate(Math.sin(B.t*.8+p.p)*.4);ctx.translate(0,Math.sin(B.t*1.4+p.p)*4);
    ctx.fillStyle="#6B58A8";
    ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(5,0);ctx.lineTo(0,11);
    ctx.lineTo(-5,0);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.restore();
  }else if(p.k==="rift"){
    ctx.globalAlpha=.5;ctx.strokeStyle="#9B5FD0";ctx.lineWidth=2;
    for(let i=0;i<3;i++){const a=B.t*(.6+i*.3)+p.p;
      ctx.beginPath();ctx.arc(0,0,7+i*5,a,a+2);ctx.stroke();}
    ctx.globalAlpha=1;
  }else if(p.k==="star"){
    ctx.fillStyle="#D8CCF5";ctx.globalAlpha=.4+Math.sin(B.t*3+p.p)*.3;
    ctx.beginPath();
    for(let i=0;i<8;i++){const a=i/8*6.283,rr=i%2?1.6:5;
      i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);}
    ctx.closePath();ctx.fill();ctx.globalAlpha=1;
  }
  ctx.restore();
}
function drawHaz(h){
  const bio=B.bio;
  ctx.save();ctx.setLineDash([4,4]);ctx.strokeStyle="rgba(240,120,120,.35)";
  ctx.lineWidth=1.4;
  if(h.w){ctx.strokeRect(h.x-2,h.y-2,h.w+4,h.hgt+4);}
  else if(h.r){ctx.beginPath();ctx.arc(h.x,h.y,h.r+3,0,6.283);ctx.stroke();}
  ctx.restore();
  if(h.k==="vent"){
    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,6.283);ctx.fill();
    ctx.strokeStyle="#5A4632";ctx.lineWidth=2;ctx.stroke();
    for(let i=0;i<6;i++){const a=i/6*6.283;
      ctx.fillStyle="#3A2C1E";
      ctx.beginPath();ctx.arc(h.x+Math.cos(a)*h.r*.55,h.y+Math.sin(a)*h.r*.55,3,0,6.283);ctx.fill();}
    if(h.warn){ctx.globalAlpha=.35+Math.sin(B.t*24)*.2;ctx.fillStyle="#E0703A";
      ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,6.283);ctx.fill();ctx.globalAlpha=1;}
    if(h.fireOn){
      const g=ctx.createRadialGradient(h.x,h.y,2,h.x,h.y,h.r);
      g.addColorStop(0,"#FFD27A");g.addColorStop(.5,"#E0703A");g.addColorStop(1,"rgba(224,112,58,0)");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,6.283);ctx.fill();
    }
  }else if(h.k==="spike"){
    ctx.fillStyle="rgba(0,0,0,.30)";ctx.fillRect(h.x,h.y,h.w,h.hgt);
    ctx.strokeStyle=h.warn?"#E8B04B":"#4A3E63";
    ctx.lineWidth=h.warn?2.5:1.5;ctx.strokeRect(h.x,h.y,h.w,h.hgt);
    const n=Math.max(3,Math.floor(h.w/16));
    for(let i=0;i<n;i++){
      const x=h.x+(i+.5)*h.w/n, ext=h.up?1:(h.warn?.35:.12);
      ctx.fillStyle=h.up?"#D6D0C0":"#3C3550";
      ctx.beginPath();ctx.moveTo(x-5,h.y+h.hgt-3);
      ctx.lineTo(x,h.y+h.hgt-3-h.hgt*.8*ext);ctx.lineTo(x+5,h.y+h.hgt-3);
      ctx.closePath();ctx.fill();
    }
  }else if(h.k==="slab"){
    ctx.strokeStyle="rgba(120,110,150,.22)";ctx.lineWidth=2;
    ctx.setLineDash([5,7]);ctx.beginPath();
    ctx.moveTo(h.a.x+h.w/2,h.a.y+h.hgt/2);ctx.lineTo(h.b.x+h.w/2,h.b.y+h.hgt/2);
    ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle="#4A4160";ctx.fillRect(h.x,h.y,h.w,h.hgt);
    ctx.fillStyle="#5E5478";ctx.fillRect(h.x,h.y,h.w,4);
    ctx.strokeStyle="#8A7EAE";ctx.lineWidth=2;ctx.strokeRect(h.x,h.y,h.w,h.hgt);
    ctx.fillStyle="#C0364B";
    for(let i=0;i<3;i++)ctx.fillRect(h.x+4+i*(h.w-12)/2,h.y+h.hgt/2-2,4,4);
  }else if(h.k==="ice"){
    ctx.fillStyle="rgba(127,196,232,.16)";ctx.fillRect(h.x,h.y,h.w,h.hgt);
    ctx.strokeStyle="rgba(159,215,255,.5)";ctx.lineWidth=1.5;
    ctx.strokeRect(h.x,h.y,h.w,h.hgt);
    ctx.strokeStyle="rgba(200,235,255,.28)";
    for(let i=0;i<5;i++){ctx.beginPath();
      ctx.moveTo(h.x+((i*37)%h.w),h.y);
      ctx.lineTo(h.x+((i*61)%h.w),h.y+h.hgt);ctx.stroke();}
  }else if(h.k==="mire"){
    ctx.fillStyle="rgba(80,140,90,.28)";ctx.fillRect(h.x,h.y,h.w,h.hgt);
    ctx.strokeStyle="rgba(111,175,140,.55)";ctx.lineWidth=2;
    ctx.strokeRect(h.x,h.y,h.w,h.hgt);
    for(let i=0;i<6;i++){
      const bx=h.x+((i*53+B.t*9)%h.w),by=h.y+((i*31)%h.hgt);
      ctx.fillStyle="rgba(160,220,180,.35)";
      ctx.beginPath();ctx.arc(bx,by,2+Math.sin(B.t*3+i)*1.2,0,6.283);ctx.fill();}
  }else if(h.k==="bramble"){
    ctx.fillStyle="rgba(150,40,60,.22)";
    ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,6.283);ctx.fill();
    ctx.strokeStyle="#8E2B3A";ctx.lineWidth=2;
    for(let i=0;i<9;i++){const a=i/9*6.283+h.t*.2;
      ctx.beginPath();ctx.moveTo(h.x+Math.cos(a)*h.r*.2,h.y+Math.sin(a)*h.r*.2);
      ctx.lineTo(h.x+Math.cos(a+.4)*h.r,h.y+Math.sin(a+.4)*h.r);ctx.stroke();}

function elemMark(g,kind,x,y,r,ph){

    g.fillStyle="#D8B0F0";

      g.beginPath();g.arc(x+Math.cos(a)*r*1.3,y+Math.sin(a)*r*1.3,r*0.34,0,6.283);g.fill();}
  }else if(kind==="shock"){
    g.strokeStyle="#FFF0A8";g.lineWidth=1.5;
    for(let i=0;i<2;i++){const a=ph*7+i*3.14;
      g.beginPath();
      g.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);
      g.lineTo(x+Math.cos(a)*r*1.8+2,y+Math.sin(a)*r*1.8-2);
      g.lineTo(x+Math.cos(a)*r*2.3-2,y+Math.sin(a)*r*2.3+1);
      g.stroke();}
  }else if(kind==="ice"){
    g.fillStyle="#DAF2FF";
    for(let i=0;i<3;i++){const a=ph*1.2+i*2.1;
      g.save();g.translate(x+Math.cos(a)*r*1.4,y+Math.sin(a)*r*1.4);g.rotate(a);
      g.beginPath();g.moveTo(0,-r*.6);g.lineTo(r*.3,r*.4);g.lineTo(-r*.3,r*.4);

      g.lineTo(x+Math.cos(a)*r*1.1+r*.5,y+Math.sin(a)*r*1.1+r*.4);
      g.lineTo(x+Math.cos(a)*r*1.1-r*.5,y+Math.sin(a)*r*1.1+r*.4);
      g.closePath();g.fill();}
  }
}

      ctx.lineTo(r*.7,r*.8);ctx.lineTo(-r*.7,r*.8);ctx.closePath();
      ctx.fill();ctx.stroke();
      ctx.fillStyle=shade(col,.3);
      ctx.beginPath();ctx.moveTo(-r*.95,-r*1.05);ctx.lineTo(r*.95,-r*1.05);
      ctx.lineTo(r*.75,-r*.75);ctx.lineTo(-r*.75,-r*.75);ctx.closePath();ctx.fill();
      ctx.fillStyle="#0E1A12";
      ctx.beginPath();ctx.ellipse(-r*.32,-r*.28,r*.19,r*.26,0,0,6.283);ctx.fill();
      ctx.beginPath();ctx.ellipse( r*.32,-r*.28,r*.19,r*.26,0,0,6.283);ctx.fill();
      ctx.fillStyle="#9FE8C0";
      ctx.beginPath();ctx.arc(-r*.32,-r*.28,r*.1,0,6.283);ctx.fill();
      ctx.beginPath();ctx.arc( r*.32,-r*.28,r*.1,0,6.283);ctx.fill();
      ctx.fillStyle=shade(col,.1);
      ctx.beginPath();ctx.moveTo(-r*.35,r*.25);ctx.lineTo(r*.35,r*.25);
      ctx.lineTo(r*.2,r*.55);ctx.lineTo(-r*.2,r*.55);ctx.closePath();ctx.fill();
      ctx.restore();
    }else if(key==="Thornmother"){
      ctx.strokeStyle=shade(col,-.2);ctx.lineWidth=4;
      for(let i=0;i<7;i++){const a=-2.9+i*0.42;
        ctx.beginPath();ctx.moveTo(0,-r*.3);
        ctx.quadraticCurveTo(Math.cos(a)*r*1.1,-r*1.1,
          Math.cos(a)*r*1.7,Math.sin(a)*r*.9-r*.5);ctx.stroke();}
      ctx.strokeStyle=ink;ctx.lineWidth=2;
      ctx.fillStyle=shade(col,-.4);
      ctx.beginPath();ctx.moveTo(0,-r*.55);
      ctx.quadraticCurveTo(r*.95,0,r*.6,r*1.1);
      ctx.lineTo(-r*.6,r*1.1);
      ctx.quadraticCurveTo(-r*.95,0,0,-r*.55);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle=col;
      for(let i=0;i<4;i++){const a=t*.8+i*1.57;
        ctx.beginPath();ctx.arc(Math.cos(a)*r*.34,Math.sin(a)*r*.3+r*.1,
          r*.15,0,6.283);ctx.fill();}
      ctx.fillStyle=shade(col,.2);
      ctx.beginPath();ctx.arc(0,-r*.72,r*.36,0,6.283);ctx.fill();ctx.stroke();
      eyes(0,-r*.74,r*.12,"#FFD2D8");
    }else if(key==="The Drowned Admiral"){
      ctx.strokeStyle=dk;ctx.lineWidth=5;
      for(let i=0;i<6;i++){const a=t*.9+i*1.047;
        ctx.beginPath();ctx.moveTo(0,r*.2);
        ctx.quadraticCurveTo(Math.cos(a)*r*1.2,r*.9+Math.sin(a)*r*.4,
          Math.cos(a)*r*1.8,r*1.1+Math.sin(a)*r*.5);ctx.stroke();}
      ctx.lineWidth=2;ctx.strokeStyle=ink;
      ctx.fillStyle=col;
      ctx.beginPath();ctx.ellipse(0,0,r*.85,r*.95,0,0,6.283);ctx.fill();ctx.stroke();
      ctx.fillStyle=shade(col,-.45);
      ctx.beginPath();ctx.moveTo(-r*1.15,-r*.55);ctx.lineTo(r*1.15,-r*.55);
      ctx.lineTo(r*.75,-r*.95);ctx.lineTo(-r*.75,-r*.95);ctx.closePath();
      ctx.fill();ctx.stroke();
      ctx.fillStyle="#EFE7D2";
      ctx.beginPath();ctx.arc(0,-r*1.02,r*.16,0,6.283);ctx.fill();
      eyes(0,-r*.18,r*.17,"#0B2A2E");
      ctx.fillStyle="#EFE7D2";
      for(let i=-2;i<=2;i++)ctx.fillRect(i*r*.16-1,r*.28,2.4,r*.22);
    }else if(key==="The Forge Tyrant"){
      ctx.fillStyle=shade(col,-.6);
      ctx.beginPath();
      if(ctx.roundRect)ctx.roundRect(-r*.85,-r*.6,r*1.7,r*1.5,r*.2);
      else ctx.rect(-r*.85,-r*.6,r*1.7,r*1.5);
      ctx.fill();ctx.stroke();
      ctx.fillStyle=col;
      for(let i=0;i<5;i++){
        const yy=-r*.4+i*r*.3, wv=Math.abs(Math.sin(t*3+i));
        ctx.fillRect(-r*.72,yy,r*1.44*(0.45+wv*0.5),4);
      }
      ctx.fillStyle=shade(col,-.35);
      for(const d of [-1,1]){ctx.save();ctx.scale(d,1);
        ctx.beginPath();ctx.moveTo(r*.8,-r*.35);ctx.lineTo(r*1.6,-r*.05);
        ctx.lineTo(r*1.45,r*.6);ctx.lineTo(r*.75,r*.35);ctx.closePath();
        ctx.fill();ctx.stroke();ctx.restore();}
      ctx.fillStyle=shade(col,-.5);
      ctx.beginPath();ctx.arc(0,-r*.85,r*.42,0,6.283);ctx.fill();ctx.stroke();
      ctx.fillStyle=dk;
      for(let i=-1;i<=1;i+=2){ctx.beginPath();
        ctx.moveTo(i*r*.3,-r*1.1);ctx.lineTo(i*r*.55,-r*1.7);
        ctx.lineTo(i*r*.12,-r*1.15);ctx.closePath();ctx.fill();}
      eyes(0,-r*.88,r*.16,"#FFE08A");
    }else{ /* The Hollow Choir */
      ctx.save();
      const gg=ctx.createRadialGradient(0,0,2,0,0,r*1.6);
      gg.addColorStop(0,"rgba(20,10,40,.95)");
      gg.addColorStop(1,"rgba(20,10,40,0)");
      ctx.fillStyle=gg;ctx.beginPath();ctx.arc(0,0,r*1.6,0,6.283);ctx.fill();
      for(let i=0;i<3;i++){
        const a=t*1.1+i*2.094;
        const mx=Math.cos(a)*r*1.05,my=Math.sin(a)*r*.75;
        ctx.save();ctx.translate(mx,my);ctx.rotate(Math.sin(t+i)*.25);
        ctx.fillStyle=col;
        ctx.beginPath();ctx.moveTo(0,-r*.5);ctx.lineTo(r*.32,-r*.1);
        ctx.lineTo(0,r*.5);ctx.lineTo(-r*.32,-r*.1);ctx.closePath();
        ctx.fill();ctx.stroke();
        ctx.fillStyle="#150C24";
        ctx.beginPath();ctx.arc(-r*.11,-r*.1,r*.07,0,6.283);ctx.fill();
        ctx.beginPath();ctx.arc( r*.11,-r*.1,r*.07,0,6.283);ctx.fill();
        ctx.restore();
        ctx.strokeStyle="rgba(155,95,208,.45)";ctx.lineWidth=1.6;
        ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(mx,my);ctx.stroke();
        ctx.strokeStyle=ink;ctx.lineWidth=2;
      }
      ctx.fillStyle="#0D0818";
      ctx.beginPath();ctx.arc(0,0,r*.5,0,6.283);ctx.fill();
      ctx.strokeStyle=col;ctx.lineWidth=2.4;
      for(let i=0;i<3;i++){const a=-t*(1.4+i*.5);
        ctx.beginPath();ctx.arc(0,0,r*(.55+i*.16),a,a+2.1);ctx.stroke();}
      ctx.restore();
    }
  }
  ctx.restore();

  if(e.kind==="boss"&&e.named){
    const bw=W-40,by=TOP+8;
    ctx.fillStyle="rgba(0,0,0,.72)";ctx.fillRect(19,by-1,bw+2,9);
    ctx.fillStyle=e.col;ctx.fillRect(20,by,bw*clamp(e.hp/e.maxhp,0,1),7);
    ctx.strokeStyle="rgba(239,231,210,.45)";ctx.lineWidth=1;
    ctx.strokeRect(19.5,by-.5,bw+1,8);
    const ph=e.def.phases;
    for(let i=1;i<ph.length;i++){const x=20+bw*ph[i].at;
      ctx.fillStyle="rgba(11,9,18,.9)";ctx.fillRect(x-1,by,2,7);}
    ctx.fillStyle="#EFE7D2";ctx.font='700 9.5px "Space Grotesk",sans-serif';
    ctx.textAlign="center";ctx.fillText(e.name.toUpperCase(),W/2,by+18);
    ctx.textAlign="left";
  }else if(e.hp<e.maxhp){
    const w=e.kind==="boss"?110:e.r*2.3;
    const y=e.y-e.r-(e.kind==="boss"?16:10);
    ctx.fillStyle="rgba(0,0,0,.7)";ctx.fillRect(e.x-w/2-1,y-1,w+2,5.5);
    ctx.fillStyle=e.kind==="boss"?B.bio.tint:"#C0364B";
    ctx.fillRect(e.x-w/2,y,w*clamp(e.hp/e.maxhp,0,1),3.5);
  }
  if(e.fire>0){ctx.fillStyle="rgba(224,112,58,.45)";
    ctx.beginPath();ctx.arc(e.x,e.y,e.r+3,0,6.283);ctx.fill();}
  if(e.poison>0){ctx.fillStyle="rgba(143,191,106,.4)";
    ctx.beginPath();ctx.arc(e.x,e.y,e.r+4,0,6.283);ctx.fill();}
  if(e.shock>0){ctx.strokeStyle="rgba(159,215,255,.75)";ctx.lineWidth=1.6;
    for(let k=0;k<3;k++){const a=B.t*9+k*2.1;
      ctx.beginPath();ctx.arc(e.x,e.y,e.r+4,a,a+1.1);ctx.stroke();}}
}
function drawHUD(){
  ctx.fillStyle="rgba(12,10,18,.94)";ctx.fillRect(0,0,W,TOP);
  ctx.fillStyle="#332C47";ctx.fillRect(0,TOP-1,W,1);
  ctx.textAlign="left";
  ctx.fillStyle="rgba(35,31,49,.92)";
  if(ctx.roundRect){ctx.beginPath();ctx.roundRect(9,9,26,24,6);ctx.fill();}
  else ctx.fillRect(9,9,26,24);
  ctx.strokeStyle="#463D5F";ctx.lineWidth=1;ctx.strokeRect(9.5,9.5,25,23);
  ctx.fillStyle="#EFE7D2";ctx.fillRect(17,15,4,12);ctx.fillRect(24,15,4,12);
  ctx.fillStyle="#918AA6";ctx.font='500 8.5px "Space Grotesk",sans-serif';
  ctx.fillText(B.bio.n.toUpperCase(),44,16);
  ctx.fillStyle="#EFE7D2";ctx.font='700 14px "Cinzel",serif';
  ctx.fillText("Stage "+B.stage,44,31);
  /* room progress */
  const rb=118, rx=W/2-rb/2;
  ctx.fillStyle="#231F31";ctx.fillRect(rx,22,rb,6);
  ctx.fillStyle=B.bio.tint;ctx.fillRect(rx,22,rb*((B.room-1)/B.rooms),6);
  for(let k=10;k<B.rooms;k+=10){
    ctx.fillStyle="rgba(11,9,18,.9)";ctx.fillRect(rx+rb*(k/B.rooms)-1,22,2,6);}
  ctx.strokeStyle="#463D5F";ctx.lineWidth=1;ctx.strokeRect(rx-.5,21.5,rb+1,7);
  ctx.fillStyle="#EFE7D2";ctx.font='700 9.5px "Space Grotesk",sans-serif';
  ctx.textAlign="center";
  ctx.fillText("ROOM "+B.room+" / "+B.rooms+
    (B.roomType==="treasure"?"  ·  VAULT":B.roomType==="elite"?"  ·  ELITE DEN":
     B.roomType==="angel"?"  ·  SANCTUARY":""),W/2,17);
  ctx.textAlign="left";
  ctx.textAlign="right";
  ctx.fillStyle="#E8B04B";ctx.font='700 12px "Space Grotesk",sans-serif';
  ctx.fillText("◆ "+fmt(B.gold),W-12,20);
  ctx.fillStyle="#918AA6";ctx.font='500 9.5px "Space Grotesk",sans-serif';
  ctx.fillText(P?P.hero.n+" · "+WCLASS[P.wc].n:"",W-12,33);
  ctx.textAlign="left";
  if(P){
    const f=clamp(P.xp/xpNeed(P.level),0,1);
    ctx.fillStyle="#231F31";ctx.fillRect(0,TOP-4,W,4);
    ctx.fillStyle="#6FAF8C";ctx.fillRect(0,TOP-4,W*f,4);
    ctx.fillStyle="#9FE1CB";ctx.font='700 9px "Space Grotesk",sans-serif';
    ctx.fillText("LV "+P.level,12,TOP-7);
    if(P.pending>0){ctx.fillStyle="#E8A22B";
      ctx.fillText("+"+P.pending+" boon",52,TOP-7);}
  }

}
/* re-wrap drawHero for world coords */
const _dh=drawHero;
drawHero=function(g,w,h,hero,t,aim,pose,wx,wy){
  if(wx===undefined)return _dh(g,w,h,hero,t,aim,pose);
  g.save();g.translate(wx,wy);_dh(g,w,h,hero,t,aim,pose);g.restore();
};

/* ==================== HUB SCENE ==================== */
const sc=$("scene"),sctx=sc.getContext("2d");
const SW=390,SH=196;
var hubOn=true;let stars=[], dust=[];
for(let i=0;i<40;i++)stars.push({x:Math.random()*SW,y:Math.random()*SH*0.6,
  s:rnd(.5,1.4),p:rnd(0,6.28)});
for(let i=0;i<18;i++)dust.push({x:Math.random()*SW,y:Math.random()*SH,
  s:rnd(1,2.6),v:rnd(6,18),p:rnd(0,6.28)});
function ridge(g,y,amp,seed,col,t,par){
  g.fillStyle=col;g.beginPath();g.moveTo(-20,SH);
  for(let x=-20;x<=SW+20;x+=10){
    const h=Math.sin((x+seed)*0.014)*amp+Math.sin((x+seed)*0.037)*amp*0.4;
    g.lineTo(x-par,y+h);
  }
  g.lineTo(SW+20,SH);g.closePath();g.fill();
}
function drawScene(t){
  const bio=biomeOf(S.stage),h=HBY[S.hero];
  const g=sctx;g.clearRect(0,0,SW,SH);
  const sky=g.createLinearGradient(0,0,0,SH);
  sky.addColorStop(0,shade(bio.tint,-.80));
  sky.addColorStop(.55,shade(bio.floor,.10));
  sky.addColorStop(1,bio.floor);
  g.fillStyle=sky;g.fillRect(0,0,SW,SH);
  /* stars */
  for(const st of stars){
    g.globalAlpha=.25+Math.sin(t*1.4+st.p)*.22;
    g.fillStyle="#EFE7D2";g.fillRect(st.x,st.y,st.s,st.s);
  }
  g.globalAlpha=1;
  /* moon */
  g.fillStyle=shade(bio.tint,.42);g.globalAlpha=.35;
  g.beginPath();g.arc(312,44,26,0,6.283);g.fill();
  g.globalAlpha=.9;g.fillStyle=shade(bio.tint,.60);
  g.beginPath();g.arc(312,44,19,0,6.283);g.fill();g.globalAlpha=1;
  /* parallax ridges */
  ridge(g,118,15,0,shade(bio.wall,-.30),t,Math.sin(t*.12)*4);
  ridge(g,140,11,400,shade(bio.wall,-.10),t,Math.sin(t*.18)*7);
  /* spire */
  g.fillStyle=shade(bio.wall,.10);
  g.beginPath();g.moveTo(58,152);g.lineTo(72,66);g.lineTo(80,60);g.lineTo(88,66);
  g.lineTo(102,152);g.closePath();g.fill();
  g.fillStyle=shade(bio.tint,-.15);
  g.beginPath();g.arc(80,54,5.5+Math.sin(t*2)*.8,0,6.283);g.fill();
  /* motes */
  for(const m of dust){
    m.y-=m.v*.016;if(m.y<-4){m.y=SH+4;m.x=Math.random()*SW;}
    g.globalAlpha=.30+Math.sin(t*2+m.p)*.22;
    g.fillStyle=shade(bio.tint,.45);
    g.fillRect(m.x+Math.sin(t+m.p)*6,m.y,m.s,m.s);
  }
  g.globalAlpha=1;
  /* ledge */
  ridge(g,158,6,900,shade(bio.wall,.22),t,0);
  g.fillStyle=shade(bio.floor,-.20);g.fillRect(0,176,SW,SH-176);
  /* campfire */
  const fx=252,fy=170;
  g.fillStyle="#3A2A1C";
  g.fillRect(fx-9,fy,18,4);g.fillRect(fx-3,fy-4,6,6);
  const fl=1+Math.sin(t*9)*.18;
  g.fillStyle="#E0703A";g.beginPath();
  g.moveTo(fx,fy-20*fl);g.lineTo(fx+7,fy-2);g.lineTo(fx-7,fy-2);g.closePath();g.fill();
  g.fillStyle="#F5C55E";g.beginPath();
  g.moveTo(fx,fy-12*fl);g.lineTo(fx+4,fy-2);g.lineTo(fx-4,fy-2);g.closePath();g.fill();
  g.globalAlpha=.10;g.fillStyle="#E0703A";
  g.beginPath();g.arc(fx,fy-6,40,0,6.283);g.fill();g.globalAlpha=1;
  /* champion */
  g.fillStyle="rgba(0,0,0,.4)";
  g.beginPath();g.ellipse(150,176,20,5,0,0,6.283);g.fill();
  drawHero(g,74,74,h,t,Math.sin(t*.5)*.9-1.57,{mv:0,atk:0,wc:h.w},113,118);
  /* bottom scrim so the title and button stay readable */
  const sh2=g.createLinearGradient(0,96,0,SH);
  sh2.addColorStop(0,"rgba(10,8,16,0)");sh2.addColorStop(1,"rgba(10,8,16,.86)");
  g.fillStyle=sh2;g.fillRect(0,96,SW,SH-96);
  /* vignette */
  g.strokeStyle="rgba(0,0,0,.35)";g.lineWidth=14;g.strokeRect(-7,-7,SW+14,SH+14);
}
function drawHeroStage(t){
  const cv2=$("heroBig");if(!cv2)return;
  const w=cv2.clientWidth,h=cv2.clientHeight;
  if(!w||!h)return;
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  if(cv2.width!==Math.floor(w*dpr)){cv2.width=Math.floor(w*dpr);cv2.height=Math.floor(h*dpr);}
  const g=cv2.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);
  const bio=biomeOf(S.stage);
  const sky=g.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,shade(bio.tint,-.72));sky.addColorStop(1,shade(bio.floor,.06));
  g.fillStyle=sky;g.fillRect(0,0,w,h);
  g.globalAlpha=.5;g.fillStyle=shade(bio.tint,.4);
  for(let i=0;i<16;i++){
    const x=(i*53)%w, y=(i*31)%(h*0.6);
    g.globalAlpha=.2+Math.sin(t*1.6+i)*.15;
    g.fillRect(x,y,1.6,1.6);
  }
  g.globalAlpha=1;
  g.fillStyle=shade(bio.wall,-.12);
  g.beginPath();g.moveTo(0,h);
  for(let x=0;x<=w;x+=8)g.lineTo(x,h*0.72+Math.sin(x*0.03)*7);
  g.lineTo(w,h);g.closePath();g.fill();
  g.fillStyle="rgba(0,0,0,.4)";
  g.beginPath();g.ellipse(w/2,h*0.80,26,7,0,0,6.283);g.fill();
  const hh=HBY[S.hero];
  drawHero(g,96,96,hh,t,Math.sin(t*.6)*1.1-1.57,
    {mv:0,atk:0,wc:equippedWClass()},w/2-48,h*0.80-72);
  const grd=g.createLinearGradient(0,h*0.55,0,h);
  grd.addColorStop(0,"rgba(16,22,34,0)");grd.addColorStop(1,"rgba(16,22,34,.85)");
  g.fillStyle=grd;g.fillRect(0,h*0.55,w,h*0.45);
}
function sceneLoop(t){
  if(hubOn&&$("sGear").classList.contains("on"))drawHeroStage(t/1000);
  if(hubOn&&$("sCamp").classList.contains("on"))drawScene(t/1000);
}
$("goBtn").onclick=()=>startStage(S.stage);
function refreshScene(){
  const b=biomeOf(S.stage);
  $("sceneSub").textContent=b.n+" · Stage "+S.stage;
  $("goBtn").textContent=S.best[S.stage]?"Replay "+S.stage:"Stage "+S.stage;
}

/* --- loop --- */
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(B.on&&!B.paused)update(dt);
  else{B.shake=Math.max(0,B.shake-dt*26);B.flash=Math.max(0,B.flash-dt*1.7);}
  if(B.on||P)draw();
  sceneLoop(now);
  requestAnimationFrame(loop);
}
document.addEventListener("visibilitychange",()=>{last=performance.now();});

/* ==================== BOOT ==================== */
function boot(){
  readSafe();fit();
  if(!S.inv.length){addItem("hbow",0);S.eq.weapon=S.inv[0].u;}
  if(S.heroes.indexOf(S.hero)<0)S.hero=S.heroes[0]||"wren";
  fit();showHub(true);
  renderTop();renderStages();renderHeroes();renderGear();renderRunes();renderForge();
  refreshScene();markTabs();
  requestAnimationFrame(loop);
}
load();
})();
