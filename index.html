<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Emberfall">
<meta name="theme-color" content="#0E0C14">
<title>Emberfall</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230E0C14'/%3E%3Cpath d='M90 28 L112 74 L162 82 L126 118 L134 168 L90 144 L46 168 L54 118 L18 82 L68 74 Z' fill='%23E0703A'/%3E%3Ccircle cx='90' cy='96' r='19' fill='%230E0C14'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230E0C14'/%3E%3Cpath d='M32 10 L40 27 L58 30 L45 43 L48 61 L32 52 L16 61 L19 43 L6 30 L24 27 Z' fill='%23E0703A'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
 --ink:#0E0C14; --pan:#1A1725; --pan2:#231F31; --line:#332C47; --line2:#463D5F;
 --bone:#EFE7D2; --dim:#918AA6; --gold:#E8B04B; --ember:#E0703A; --verd:#6FAF8C;
 --blood:#C0364B;
 --r0:#7C7689; --r1:#5FA85E; --r2:#3E86D6; --r3:#9B5FD0; --r4:#E8A22B; --r5:#D33B52; --r6:#F04FA0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#08070C;color:var(--bone);
  font-family:"Space Grotesk",system-ui,sans-serif;overflow:hidden;touch-action:none}
#app{position:relative;margin:0 auto;background:var(--ink);overflow:hidden;
  display:flex;flex-direction:column}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.it canvas,.slot canvas,.hero canvas,.mbody canvas{position:static;display:block}
.scr{position:absolute;left:0;right:0;top:42px;bottom:46px;display:none;
  flex-direction:column;z-index:2;background:var(--ink)}
.scr.on{display:flex}
.pad{padding:10px 12px}
.grow{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
h1{font-family:"Cinzel",serif;font-weight:900;font-size:30px;letter-spacing:.06em;margin:0}
h2{font-family:"Cinzel",serif;font-weight:700;font-size:17px;margin:0 0 8px;letter-spacing:.04em}
.mut{color:var(--dim);font-size:11.5px;line-height:1.5}

/* top bar */
#top{display:flex;align-items:center;gap:8px;background:#13111C;
  border-bottom:1px solid var(--line);padding:0 10px;z-index:3;flex:0 0 auto;height:42px}
.res{display:flex;align-items:center;gap:4px;background:#0C0A12;border:1px solid var(--line);
  border-radius:20px;padding:3px 10px 3px 6px;font-size:11.5px;font-weight:700}
.res i{font-style:normal;font-size:12px}
.pill{margin-left:auto;font-size:10.5px;color:var(--dim)}

/* tabs */
#tabs{display:flex;background:#13111C;border-top:1px solid var(--line);flex:0 0 auto;
  z-index:3;margin-top:auto;height:46px}
.tab{flex:1;padding:9px 2px 8px;text-align:center;font-size:10px;font-weight:700;
  color:#6E6784;letter-spacing:.04em;cursor:pointer;border-top:2px solid transparent}
.tab b{display:block;font-size:17px;font-weight:400;margin-bottom:2px;line-height:1}
.tab.sel{color:var(--gold);border-top-color:var(--gold);background:#1B1726}
.tab{position:relative}
.tab.dot:after{content:"";position:absolute;top:5px;right:calc(50% - 19px);
  width:7px;height:7px;border-radius:50%;background:var(--blood);
  box-shadow:0 0 0 2px #13111C}

/* buttons */
.btn{font-family:inherit;font-weight:700;font-size:14px;color:#20160A;background:var(--gold);
  border:0;border-bottom:3px solid #9A6E20;padding:12px 26px;border-radius:6px;cursor:pointer}
.btn:active{transform:translateY(2px);border-bottom-width:1px}
.btn.g{background:var(--verd);border-bottom-color:#3A6B54;color:#0B1A14}
.btn.o{background:transparent;color:var(--dim);border:1px solid var(--line2);
  border-bottom-width:1px;font-weight:500;font-size:12px;padding:9px 18px}
.btn[disabled]{background:#2C2740;color:#655E7A;border-bottom-color:#221E33;cursor:default}

/* stage list */
.chapter{font-family:"Cinzel",serif;font-size:12px;letter-spacing:.14em;color:var(--dim);
  margin:14px 2px 7px;display:flex;align-items:center;gap:8px}
.chapter:after{content:"";flex:1;height:1px;background:var(--line)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.node{position:relative;aspect-ratio:1;border-radius:7px;background:var(--pan);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;cursor:pointer;position:relative}
.node.lock{background:#131019;color:#3E3852;border-color:#221E2E;cursor:default}
.node.done{border-color:var(--verd)}
.node.next{border-color:var(--gold);background:#2A2113;box-shadow:0 0 0 1px var(--gold) inset}
.node.boss{border-width:2px}
.node .st{font-size:7px;letter-spacing:1px;color:var(--gold);margin-top:1px;height:8px}

/* cards / gear */
.gg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.it{position:relative;aspect-ratio:1;border-radius:7px;border:2px solid var(--line);
  background:#161320;display:flex;align-items:center;justify-content:center;cursor:pointer;
  overflow:hidden}
.it canvas{position:static;width:100%;height:100%}
.it .cnt{position:absolute;right:2px;bottom:1px;font-size:9.5px;font-weight:700;
  background:rgba(0,0,0,.72);padding:0 4px;border-radius:3px}
.it .nw,.node .nw{position:absolute;left:2px;top:2px;font-size:7.5px;font-weight:700;
  letter-spacing:.06em;background:var(--blood);color:#fff;border-radius:3px;
  padding:1px 3px;z-index:2;animation:nwPulse 1.4s ease-in-out infinite alternate}
@keyframes nwPulse{from{opacity:.6}to{opacity:1}}
.it .lv{position:absolute;left:2px;bottom:14px;font-size:8.5px;font-weight:700;color:#fff;
  background:rgba(0,0,0,.6);padding:0 3px;border-radius:3px}
.it.eq:after{content:"E";position:absolute;left:2px;bottom:1px;font-size:8.5px;
  font-weight:700;color:#0B1A14;background:var(--verd);border-radius:3px;padding:0 3px}
.it.sel{outline:2px solid #fff;outline-offset:-4px}
.rr{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.1em;
  padding:2px 6px;border-radius:3px;color:#0C0A12}

/* slots */
.loadout{display:grid;grid-template-columns:62px 1fr 62px;gap:8px;align-items:center;
  margin:2px 0 8px}
.lcol{display:flex;flex-direction:column;gap:8px}
.hstage{position:relative;height:186px;border-radius:12px;overflow:hidden;
  background:linear-gradient(#1E2A3E,#141B28 62%,#101622);
  border:1px solid var(--line)}
.hstage canvas{position:absolute;inset:0;width:100%;height:100%}
.hstage .hname{position:absolute;left:0;right:0;bottom:6px;text-align:center;
  font-family:"Cinzel",serif;font-weight:700;font-size:13px;letter-spacing:.06em;
  color:var(--bone);text-shadow:0 2px 3px rgba(0,0,0,.8)}
.statbar{display:flex;gap:7px;margin-bottom:12px}
.statbar .sp{flex:1;display:flex;align-items:center;gap:6px;background:var(--pan);
  border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.statbar .sp i{font-style:normal;font-size:14px}
.statbar .sp b{font-size:14px;font-weight:700}
.statbar .sp span{font-size:9px;letter-spacing:.12em;color:var(--dim);margin-left:auto}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.slot{aspect-ratio:1;border-radius:9px;border:2px dashed var(--line);background:#141220;
  display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.slot.filled{border-style:solid;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.slot .tagn{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:7px;
  color:#5D566F;letter-spacing:.1em}
.slot .glyph{position:absolute;top:-6px;left:-6px;width:19px;height:19px;border-radius:50%;
  background:#12101B;border:1.5px solid var(--line2);display:flex;align-items:center;
  justify-content:center;font-size:9px;z-index:2}
.slot .lvtag{position:absolute;top:-6px;right:-4px;font-size:8px;font-weight:700;
  background:#12101B;border:1px solid var(--line2);border-radius:4px;padding:0 3px;z-index:2}
.slot canvas{width:100%;height:100%;border-radius:7px}

/* hero row */
.hero{display:flex;gap:10px;align-items:center;background:var(--pan);border:1px solid var(--line);
  border-radius:9px;padding:9px;margin-bottom:8px;cursor:pointer}
.hero.sel{border-color:var(--gold);background:#231C13}
.hero canvas{width:56px;height:56px;flex:0 0 56px;background:#12101B;border-radius:7px}
.hero .nm{font-weight:700;font-size:14px}
.hero .ab{font-size:10.5px;color:var(--gold);font-weight:500;margin:1px 0 2px}

/* modal */
#fuseFX{position:absolute;inset:0;z-index:12;display:none;
  align-items:center;justify-content:center;background:rgba(8,7,12,.9)}
#fuseFX.on{display:flex}
#fuseFX .fuseIn,#fuseFX .fuseOut{position:absolute;width:62px;height:62px;
  border-radius:8px;border:2px solid #463D5F;overflow:hidden}
#fuseFX .fuseIn{animation:fuseIn .62s cubic-bezier(.6,-0.3,.4,1) forwards}
#fuseFX .fuseIn:nth-child(1){--fx:-84px}
#fuseFX .fuseIn:nth-child(2){--fx:0px}
#fuseFX .fuseIn:nth-child(3){--fx:84px}
@keyframes fuseIn{
  0%{transform:translateX(var(--fx)) scale(1);opacity:1}
  70%{transform:translateX(0) scale(.9);opacity:1}
  100%{transform:translateX(0) scale(.2);opacity:0}}
#fuseFX .fuseOut{opacity:0;transform:scale(.2);
  animation:fuseOut .7s .58s cubic-bezier(.2,1.7,.4,1) forwards}
@keyframes fuseOut{
  0%{opacity:0;transform:scale(.2) rotate(-14deg)}
  45%{opacity:1;transform:scale(1.5) rotate(6deg)}
  100%{opacity:1;transform:scale(1.15) rotate(0)}}
#fuseFX .fuseLbl{position:absolute;top:calc(50% + 74px);text-align:center;
  font-family:"Cinzel",serif;font-weight:700;font-size:16px;letter-spacing:.05em;
  opacity:0;animation:fuseLbl .5s .95s forwards}
@keyframes fuseLbl{to{opacity:1;transform:translateY(0)}}
#fuseFX .flash{position:absolute;inset:0;background:#fff;opacity:0;
  animation:fuseFlash .45s .55s forwards;pointer-events:none}
@keyframes fuseFlash{0%{opacity:0}25%{opacity:.55}100%{opacity:0}}
#modal{position:absolute;inset:0;background:rgba(6,5,10,.86);z-index:9;display:none;
  align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
.mbox{width:100%;max-width:330px;background:var(--pan);border:1px solid var(--line2);
  border-radius:11px;overflow:hidden;max-height:86%;display:flex;flex-direction:column}
.mhead{padding:11px 13px;text-align:center;font-family:"Cinzel",serif;font-weight:700;font-size:16px}
.mbody{padding:13px;overflow-y:auto}
.stat{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;
  border-bottom:1px solid var(--line);color:var(--dim)}
.stat b{color:var(--bone);font-weight:500}
.skill{background:#12101B;border-left:3px solid var(--gold);padding:8px 10px;margin-top:8px;
  font-size:11.5px;line-height:1.5;color:#DCD3C0}
.mfoot{display:flex;gap:7px;padding:11px 13px;border-top:1px solid var(--line)}
.mfoot .btn{flex:1;padding:11px 8px;font-size:13px}

/* battle overlays */
.ovl{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;background:rgba(9,8,14,.93);z-index:6;padding:18px;text-align:center}
.ovl.on{display:flex}
.boon{display:flex;gap:11px;align-items:center;text-align:left;width:100%;max-width:320px;
  background:var(--pan);border:1px solid var(--line);border-left:4px solid var(--r0);
  padding:11px 12px;border-radius:6px;margin-bottom:8px;cursor:pointer}
.boon .gl{width:32px;flex:0 0 32px;text-align:center;font-size:19px;font-weight:700}
.boon .bn{font-weight:700;font-size:13.5px}
.boon .bd{font-size:11px;color:var(--dim);line-height:1.4;margin-top:1px}
#drops{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:12px 0}
#drops .it{width:60px;height:60px;aspect-ratio:auto}
#pBoons{width:100%;max-width:330px;max-height:42vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:5px}
.pb{display:flex;align-items:center;gap:9px;background:var(--pan);
  border:1px solid var(--line);border-left:3px solid;border-radius:6px;
  padding:6px 9px;text-align:left}
.pb .pg{width:20px;text-align:center;font-size:15px;font-weight:700}
.pb .pn{font-size:12px;font-weight:700;flex:1}
.pb .pd{font-size:10px;color:var(--dim);line-height:1.3}
.pb .px{font-size:11px;font-weight:700;color:var(--gold)}
#boonRank{font-family:"Cinzel",serif;font-weight:700;font-size:11px;letter-spacing:.28em;
  margin-bottom:2px}
#oBoon h2{margin-bottom:14px}
.boon{transition:transform .12s,border-color .2s;position:relative;overflow:hidden}
.boon.spin .bn,.boon.spin .bd,.boon.spin .gl{opacity:.45;filter:blur(.6px)}
.boon.lock{animation:snap .3s cubic-bezier(.2,1.6,.4,1)}
.boon.ready{cursor:pointer}
.boon.ready:active{transform:scale(.97)}
@keyframes snap{0%{transform:scale(1.13) translateX(5px)}100%{transform:scale(1)}}
.boon:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.16) 50%,transparent 62%);
  transform:translateX(-140%)}
.boon.lock:after{animation:sheen .5s ease-out}
@keyframes sheen{to{transform:translateX(140%)}}
.tier2 .boon.lock{box-shadow:0 0 0 1px var(--tc) inset}
.tier3 .boon.lock{box-shadow:0 0 0 2px var(--tc) inset}
.tier3 #boonRank{animation:pulseRank .8s ease-in-out infinite alternate}
@keyframes pulseRank{from{opacity:.55}to{opacity:1}}
.tier3.ovl{background:radial-gradient(circle at 50% 42%,rgba(232,162,43,.16),rgba(9,8,14,.95) 62%)}
.tier2.ovl{background:radial-gradient(circle at 50% 42%,rgba(155,95,208,.13),rgba(9,8,14,.95) 62%)}
.toast{position:absolute;left:0;right:0;top:64px;text-align:center;z-index:8;
  pointer-events:none;font-size:12px;font-weight:700}
.toast span{background:rgba(10,8,16,.94);border:1px solid var(--line2);
  padding:7px 14px;border-radius:20px}
#modal textarea{width:100%;height:74px;background:#0C0A12;color:var(--bone);
  border:1px solid var(--line2);border-radius:6px;padding:8px;font-family:var(--font-mono),
  ui-monospace,monospace;font-size:10px;line-height:1.35;resize:none;
  -webkit-user-select:text;user-select:text}

/* hub scene */
#sceneWrap{position:relative;flex:0 0 auto;border-bottom:1px solid var(--line);overflow:hidden}
#scene{display:block;width:100%;height:196px}
#sceneUI{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;padding:0 0 11px;pointer-events:none}
#sceneUI .ttl{font-family:"Cinzel",serif;font-weight:900;font-size:25px;letter-spacing:.09em;
  text-shadow:0 2px 0 rgba(0,0,0,.6);margin-bottom:1px}
#sceneUI .sb{font-size:10px;letter-spacing:.16em;color:#C9C0DC;text-transform:uppercase;
  text-shadow:0 1px 2px rgba(0,0,0,.8);margin-bottom:9px}
#goBtn{pointer-events:auto;font-family:"Cinzel",serif;font-weight:700;font-size:17px;
  letter-spacing:.06em;color:#2A1C06;background:linear-gradient(#F5C55E,#D9932C);
  border:0;border-bottom:4px solid #8E5F14;padding:11px 44px;border-radius:8px;cursor:pointer}
#goBtn:active{transform:translateY(2px);border-bottom-width:2px}

/* runes */
.rslots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:9px}
.rslot{aspect-ratio:1;border-radius:9px;border:2px dashed var(--line);background:#141220;
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.rslot canvas{width:100%;height:100%}
.setb{display:flex;gap:9px;align-items:flex-start;background:var(--pan);
  border:1px solid var(--line);border-left:3px solid;border-radius:7px;
  padding:8px 10px;margin-bottom:6px;font-size:11.5px;line-height:1.45}
.setb b{font-size:12px}
.setb .off{color:#5D566F}
.rg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
</style>

<div id="app">
<canvas id="c"></canvas>

<div id="top">
  <div class="res" style="color:var(--gold)"><i>◆</i><span id="rGold">0</span></div>
  <div class="res" style="color:var(--verd)"><i>❖</i><span id="rGem">0</span></div>
  <div class="res" style="color:var(--ember)"><i>✦</i><span id="rSoul">0</span></div>
  <div class="pill" id="rLv">Rank 1</div>
  <div id="cog" style="flex:0 0 auto;padding:4px 2px 4px 8px;font-size:16px;
    color:#918AA6;cursor:pointer">⚙</div>
</div>

<!-- CAMPAIGN -->
<div class="scr on" id="sCamp">
  <div id="sceneWrap">
    <canvas id="scene"></canvas>
    <div id="sceneUI">
      <div class="ttl">EMBERFALL</div>
      <div class="sb" id="sceneSub"></div>
      <button id="goBtn">Descend</button>
    </div>
  </div>
  <div class="grow pad" id="stageList"></div>
</div>

<!-- HEROES -->
<div class="scr" id="sHero">
  <div class="grow pad"><h2>Champions</h2><div id="heroList"></div></div>
</div>

<!-- GEAR -->
<div class="scr" id="sGear">
  <div class="grow pad">
    <div class="loadout">
      <div class="lcol" id="slotL"></div>
      <div class="hstage">
        <canvas id="heroBig"></canvas>
        <div class="hname" id="heroName"></div>
      </div>
      <div class="lcol" id="slotR"></div>
    </div>
    <div class="statbar">
      <div class="sp"><i style="color:#E8B04B">⚔</i><b id="statAtk">0</b><span>ATK</span></div>
      <div class="sp"><i style="color:#C0364B">♥</i><b id="statHp">0</b><span>HP</span></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 7px">
      <h2 style="margin:0">Vault</h2>
      <button class="btn o" id="scrapLow" style="margin-right:6px">Scrap low</button>
      <button class="btn o" id="mergeAll">Merge all</button>
    </div>
    <div class="gg" id="invBox"></div>
    <p class="mut" id="invEmpty" style="text-align:center;margin-top:20px"></p>
  </div>
</div>

<!-- RUNES -->
<div class="scr" id="sRune">
  <div class="grow pad">
    <h2>Runes</h2>
    <div class="rslots" id="runeSlots"></div>
    <div id="setBox"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 7px">
      <h2 style="margin:0">Rune bag</h2>
      <button class="btn o" id="rmergeAll">Merge all</button>
    </div>
    <div class="rg" id="runeBag"></div>
    <p class="mut" id="runeEmpty" style="text-align:center;margin-top:20px"></p>
  </div>
</div>

<!-- FORGE -->
<div class="scr" id="sForge">
  <div class="grow pad">
    <h2>Forge</h2>
    <p class="mut">Three copies of the same item at the same tier fuse into one of the next tier. Three Mythics become Chaotic.</p>
    <div id="forgeList" style="margin-top:12px"></div>
  </div>
</div>

<div id="tabs">
  <div class="tab sel" data-s="sCamp"><b>⚔</b>Campaign</div>
  <div class="tab" data-s="sHero"><b>☗</b>Champions</div>
  <div class="tab" data-s="sGear"><b>⛨</b>Gear</div>
  <div class="tab" data-s="sRune"><b>❖</b>Runes</div>
  <div class="tab" data-s="sForge"><b>⚒</b>Forge</div>
</div>

<!-- battle overlays -->
<div class="ovl" id="oBoon">
  <div id="boonRank">COMMON BOON</div>
  <h2 id="boonTitle">Level up</h2>
  <div id="boonBox" style="width:100%;max-width:330px"></div>
  <div class="mut" id="boonHint" style="margin-top:6px;letter-spacing:.1em"></div>
</div>

<div class="ovl" id="oEnd">
  <h1 id="endTitle" style="font-size:24px">Cleared</h1>
  <p class="mut" id="endSub" style="margin:6px 0 4px"></p>
  <div id="drops"></div>
  <p class="mut" id="endLoot"></p>

const KEY="emberfall2";
/* Works in the Claude app (window.storage), on any web host or home-screen
   install (localStorage), and degrades to memory-only if both are blocked. */
let MEM=null;
const STORE={
  async get(){
    try{if(window.storage){const r=await window.storage.get(KEY);
      if(r&&r.value)return r.value;}}catch(e){}
    try{const v=window.localStorage.getItem(KEY);if(v)return v;}catch(e){}
    return MEM;
  },
  async set(v){
    MEM=v;
    let ok=false;
    try{if(window.storage){await window.storage.set(KEY,v);ok=true;}}catch(e){}
    try{window.localStorage.setItem(KEY,v);ok=true;}catch(e){}
    return ok;
  }
};
async function load(){
  try{const v=await STORE.get();if(v)S=Object.assign(S,JSON.parse(v));}catch(e){}
  boot();
}
let saveT=null;
function save(){clearTimeout(saveT);
  saveT=setTimeout(()=>{try{STORE.set(JSON.stringify(S));}catch(e){}},350);}

function itemStats(it){
  const g=GBY[it.id],m=RAR[it.r].mul,lv=1+(it.lv-1)*0.14;
  return {atk:Math.round(g.atk*m*lv),hp:Math.round(g.hp*m*lv)};
}
const SCRAP=[15,40,100,260,700,1800,0];
function scrapValue(it){
  let v=SCRAP[it.r];
  for(let l=1;l<it.lv;l++)v+=Math.round(120*Math.pow(1.5,l-1)*(1+it.r*0.5)*0.7);
  return v;
}

/* ==================== SPRITES ==================== */
function drawHero(g,w,h,hero,t,aim,pose){
  const cx=w/2,cy=h/2,s=Math.min(w,h)/64;
  const mv=(pose&&pose.mv)||0, atk=(pose&&pose.atk)||0, wc=(pose&&pose.wc)||hero.w;
  const step=Math.sin(t*9.5), walk=step*mv;
  const bob=(Math.sin(t*2.6)*0.8*(1-mv)+Math.abs(step)*1.5*mv)*s;
  const dir=(aim===undefined)?1:(Math.cos(aim)>=0?1:-1);
  const skin=hero.col, dark=shade(skin,-.28);
  g.save();g.translate(cx,cy+bob);g.rotate(mv*dir*0.05);
  g.lineWidth=2*s;g.strokeStyle="#0B0912";g.lineJoin="round";g.lineCap="round";

  g.save();g.rotate(-walk*0.10);
  g.fillStyle=hero.cape;
  g.beginPath();g.moveTo(-8*s,-4*s);g.lineTo(8*s,-4*s);
  g.lineTo(11*s+walk*1.5*s,15*s);g.lineTo(-11*s+walk*1.5*s,15*s);
  g.closePath();g.fill();g.stroke();g.restore();

  [[-3.7,walk],[3.7,-walk]].forEach(function(L){
    g.save();g.translate(L[0]*s,9*s);g.rotate(L[1]*0.34);
    g.fillStyle=dark;g.beginPath();
    if(g.roundRect)g.roundRect(-2.4*s,0,4.8*s,8*s,2.2*s);else g.rect(-2.4*s,0,4.8*s,8*s);
    g.fill();g.stroke();
    g.fillStyle=shade(hero.cape,-.5);g.beginPath();
    if(g.roundRect)g.roundRect(-2.9*s,6*s,5.8*s,3.4*s,1.6*s);else g.rect(-2.9*s,6*s,5.8*s,3.4*s);
    g.fill();g.stroke();g.restore();
  });

  const sq=1+Math.sin(t*4.2)*0.025;
  g.save();g.scale(1/sq,sq);
  g.fillStyle=hero.cape;g.beginPath();
  if(g.roundRect)g.roundRect(-7*s,-3*s,14*s,13*s,4*s);else g.rect(-7*s,-3*s,14*s,13*s);
  g.fill();g.stroke();
  g.fillStyle=shade(hero.cape,.22);g.beginPath();
  if(g.roundRect)g.roundRect(-2.2*s,-3*s,4.4*s,13*s,2*s);else g.rect(-2.2*s,-3*s,4.4*s,13*s);
  g.fill();g.restore();

  g.fillStyle=skin;
  g.save();g.translate(-7*s,0);g.rotate(-walk*0.4-0.2);g.beginPath();
  if(g.roundRect)g.roundRect(-2.1*s,-1*s,4.2*s,9*s,2*s);else g.rect(-2.1*s,-1*s,4.2*s,9*s);
  g.fill();g.stroke();g.restore();
  g.save();g.translate(7*s,0);g.rotate(walk*0.4+0.2-atk*0.5);g.beginPath();
  if(g.roundRect)g.roundRect(-2.1*s,-1*s,4.2*s,9*s,2*s);else g.rect(-2.1*s,-1*s,4.2*s,9*s);
  g.fill();g.stroke();g.restore();

  if(aim!==undefined&&pose){
    const reach=(1-atk)*5*s;
    g.save();g.translate(Math.cos(aim)*(9*s+reach),Math.sin(aim)*(9*s+reach)+2*s);
    g.rotate(aim);g.lineWidth=1.8*s;
    const acc=shade(skin,.4);
    if(wc==="bow"){
      g.strokeStyle="#8A6A3A";g.lineWidth=2.6*s;
      g.beginPath();g.arc(0,0,7*s,-1.25,1.25);g.stroke();
      g.strokeStyle="#E8E0CC";g.lineWidth=1*s;
      g.beginPath();g.moveTo(2.2*s,-6.6*s);g.lineTo(-2*s-atk*3*s,0);g.lineTo(2.2*s,6.6*s);g.stroke();
    }else if(wc==="dagger"){
      g.fillStyle=acc;g.beginPath();g.moveTo(9*s,0);g.lineTo(1*s,-2.4*s);

function drawRune(g,w,h,rn){

  g.fillStyle=gr;g.fillRect(0,0,w,h);

  g.fillText(el.g,0,1*s);
  g.restore();
  g.strokeStyle=col;g.lineWidth=2;g.strokeRect(1,1,w-2,h-2);
  if(rn.r>=5){g.fillStyle=RAR[rn.r].c;g.font="bold "+(11*s)+'px sans-serif';
    g.textAlign="left";g.textBaseline="alphabetic";g.fillText("★",3,13*s);}

    g.quadraticCurveTo(11*s,-6*s,3*s,-3*s);g.closePath();g.fill();g.stroke();
    g.fillStyle=sc;
    for(let i=0;i<4;i++){g.beginPath();
      g.moveTo(5*s+i*3*s,-6*s-i*1.2*s);g.lineTo(7*s+i*3*s,-9*s-i*1.2*s);
      g.lineTo(8.5*s+i*3*s,-5*s-i*1.2*s);g.closePath();g.fill();}
    g.fillStyle=A;g.beginPath();g.arc(1*s,-6*s,2.6*s,0,6.283);g.fill();
    break;
  case "u_helm":
    g.fillStyle="#241830";g.beginPath();g.arc(0,0,10*s,Math.PI*.85,Math.PI*2.15);
    g.lineTo(6*s,10*s);g.lineTo(-6*s,10*s);g.closePath();g.fill();g.stroke();
    g.fillStyle=sc;
    g.beginPath();g.moveTo(-5*s,-1*s);g.lineTo(-1.4*s,1*s);g.lineTo(-5*s,3*s);
    g.closePath();g.fill();
    g.beginPath();g.moveTo(5*s,-1*s);g.lineTo(1.4*s,1*s);g.lineTo(5*s,3*s);
    g.closePath();g.fill();
    g.fillStyle=A;
    g.beginPath();g.moveTo(-10*s,-6*s);g.lineTo(-15*s,-16*s);g.lineTo(-6*s,-10*s);
    g.closePath();g.fill();
    g.beginPath();g.moveTo(10*s,-6*s);g.lineTo(15*s,-16*s);g.lineTo(6*s,-10*s);
    g.closePath();g.fill();
    break;
  case "u_arm":
    g.fillStyle="#241830";
    g.beginPath();g.moveTo(-11*s,-10*s);g.lineTo(0,-13*s);g.lineTo(11*s,-10*s);
    g.lineTo(9*s,6*s);g.lineTo(0,12*s);g.lineTo(-9*s,6*s);g.closePath();
    g.fill();g.stroke();
    g.strokeStyle=sc;g.lineWidth=1.5*s;
    for(let i=0;i<4;i++){g.beginPath();
      g.moveTo(-8*s+i*5*s,-8*s);g.lineTo(-6*s+i*5*s,8*s);g.stroke();}
    g.strokeStyle="#0B0912";
    g.fillStyle=A;g.beginPath();g.arc(0,-2*s,3.2*s,0,6.283);g.fill();
    break;
  case "u_ring":
    g.strokeStyle="#241830";g.lineWidth=4.4*s;
    g.beginPath();g.arc(0,3*s,8.4*s,0,6.283);g.stroke();
    g.strokeStyle=sc;g.lineWidth=1.6*s;
    g.beginPath();g.arc(0,3*s,11*s,.4,3.4);g.stroke();
    g.strokeStyle="#0B0912";g.lineWidth=1.6*s;
    g.fillStyle=A;
    g.beginPath();g.moveTo(0,-13*s);g.lineTo(4*s,-7*s);g.lineTo(0,-2*s);
    g.lineTo(-4*s,-7*s);g.closePath();g.fill();g.stroke();
    break;
  case "u_charm":
    g.fillStyle="#241830";
    g.beginPath();g.moveTo(0,12*s);
    g.bezierCurveTo(-14*s,0,-8*s,-13*s,0,-6*s);
    g.bezierCurveTo(8*s,-13*s,14*s,0,0,12*s);g.fill();g.stroke();
    g.fillStyle=sc;
    g.beginPath();g.moveTo(0,7*s);
    g.bezierCurveTo(-7*s,0,-4*s,-6*s,0,-2*s);
    g.bezierCurveTo(4*s,-6*s,7*s,0,0,7*s);g.fill();
    break;
  case "u_boots":
    g.fillStyle="#241830";g.beginPath();g.moveTo(-5*s,-12*s);g.lineTo(4*s,-12*s);
    g.lineTo(5*s,3*s);g.lineTo(12*s,5*s);g.lineTo(12*s,11*s);g.lineTo(-6*s,11*s);
    g.closePath();g.fill();g.stroke();
    g.fillStyle=sc;
    for(let i=0;i<3;i++)g.fillRect(-4*s+i*5*s,-10*s,2.4*s,2.4*s);
    g.strokeStyle=A;g.lineWidth=1.6*s;
    g.beginPath();g.moveTo(-6*s,11*s);g.lineTo(-13*s,14*s);g.stroke();
    g.beginPath();g.moveTo(0,11*s);g.lineTo(-7*s,15*s);g.stroke();
    break;
  default:
    g.fillStyle=A;g.beginPath();g.arc(0,0,11*s,0,6.283);g.fill();g.stroke();
  }
}
function shade(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g2=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  if(amt>0){r+= (255-r)*amt;g2+=(255-g2)*amt;b+=(255-b)*amt;}
  else{r*=(1+amt);g2*=(1+amt);b*=(1+amt);}
  const h=v=>clamp(Math.round(v),0,255).toString(16).padStart(2,"0");
  return "#"+h(r)+h(g2)+h(b);
}

const PLV_CAP=100;
function plvNeed(l){return Math.round(120*Math.pow(1.16,l-1));}
function addPlayerXP(v){
  S.plv=S.plv||1;S.pxp=(S.pxp||0)+v;
  let gained=0;
  while(S.plv<PLV_CAP&&S.pxp>=plvNeed(S.plv)){S.pxp-=plvNeed(S.plv);S.plv++;gained++;}
  if(S.plv>=PLV_CAP)S.pxp=0;
  return gained;
}
function plvBonus(){
  const l=(S.plv||1)-1;
  return {hp:1+l*0.020, atk:1+l*0.013, dodge:Math.min(0.15,l*0.0016)};

  const h=HBY[S.hero],t=totalStats();

  const c=setBonuses();for(const e in c){if(c[e]>=2)rp+=250;if(c[e]>=4)rp+=900;}
  return Math.round((h.atk+t.atk)*12+(h.hp+t.hp)*1.4+rp);

function exportCode(){
  try{return btoa(unescape(encodeURIComponent(JSON.stringify(S))));}

function importCode(v){
  try{
    const o=JSON.parse(decodeURIComponent(escape(atob(v.replace(/\s+/g,"")))));
    if(!o||typeof o.stage!=="number"||!Array.isArray(o.inv))return false;
    S=Object.assign({gold:0,gem:0,soul:0,rank:1,stage:1,best:{},hero:"wren",
      heroes:["wren"],inv:[],eq:{},runes:[],eqr:{},uid:1},o);
    if(!Array.isArray(S.runes))S.runes=[];
    if(!S.eqr||typeof S.eqr!=="object")S.eqr={};
    if(!S.heroes.length)S.heroes=["wren"];
    if(S.heroes.indexOf(S.hero)<0)S.hero=S.heroes[0];
    let mx=0;S.inv.concat(S.runes).forEach(i=>{if(i&&i.u>mx)mx=i.u;});
    S.uid=Math.max(S.uid||1,mx+1);
    return true;
  }catch(e){return false;}
}

const SFUSE=[null,null,null,
 {need:8, minR:2, label:"Rare or better"},
 {need:14,minR:3, label:"Epic or better"},
 {need:22,minR:4, label:"Legendary or better"}];
function materialPool(minR){
  return S.inv.filter(it=>!GBY[it.id].set&&it.r>=minR&&!isEquipped(it.u));
}
function fuseCost(it){
  if(!GBY[it.id].set)return null;
  return SFUSE[it.r]||null;
}
function payMaterials(req){
  const pool=materialPool(req.minR).sort((a,b)=>a.r-b.r||a.lv-b.lv);
  if(pool.length<req.need)return false;
  pool.slice(0,req.need).forEach(m=>{
    S.inv.splice(S.inv.indexOf(m),1);
    for(const sl of SLOTS)if(S.eq[sl]===m.u)delete S.eq[sl];
  });
  return true;
}
function mergeGroups(){
  const m={};
  S.inv.forEach(it=>{if(it.r>=6)return;const k=it.id+"|"+it.r;(m[k]=m[k]||[]).push(it);});
  return Object.keys(m).filter(k=>m[k].length>=3).map(k=>({k,items:m[k]}));
}
function doMerge(items){
  const three=items.slice(0,3);
  const req=fuseCost(three[0]);
  if(req&&!payMaterials(req))return null;
  const eqLost=three.some(i=>Object.values(S.eq).indexOf(i.u)>=0);
  three.forEach(i=>{
    S.inv.splice(S.inv.indexOf(i),1);
    for(const s of SLOTS)if(S.eq[s]===i.u)delete S.eq[s];
  });
  const nit=addItem(three[0].id,three[0].r+1);
  nit.lv=Math.max.apply(null,three.map(i=>i.lv));
  if(eqLost)S.eq[GBY[nit.id].slot]=nit.u;
  return nit;
}
function fuseFX(items,result,isRune,done){

    el.innerHTML="";el.style.borderColor=RAR[items[i].r].c;
    el.appendChild(mk(items[i]));
    el.style.animation="none";void el.offsetWidth;el.style.animation="";
  });
  out.innerHTML="";out.style.borderColor=RAR[result.r].c;
  out.style.boxShadow="0 0 26px "+RAR[result.r].c;
  out.appendChild(mk(result));
  out.style.animation="none";void out.offsetWidth;out.style.animation="";
  lbl.textContent=RAR[result.r].n.toUpperCase();
  lbl.style.color=RAR[result.r].c;
  lbl.style.animation="none";void lbl.offsetWidth;lbl.style.animation="";

function bossScript(b,dt){
  const d=b.def,ph=d.phases;
  let idx=0;
  for(let i=0;i<ph.length;i++)if(b.hp<=b.maxhp*ph[i].at)idx=i;
  if(idx!==b.phase){
    b.phase=idx;b.seq=0;b.cool=1.0;
    burst(b.x,b.y,b.col,30,260);ring(b.x,b.y,180,b.col);
    B.shake=12;say(b.x,b.y-52,"PHASE "+(idx+1),b.col,true);
  }
  const cur=ph[idx];
  if(b.charge>0){b.charge-=dt;moveE(b,b.vx,b.vy,dt);
    if(b.x<=b.r+1||b.x>=W-b.r-1)b.vx*=-1;
    if(b.y<=TOP+b.r+1||b.y>=H-b.r-1)b.vy*=-1;
    return;}
  const dx=P.x-b.x,dy=P.y-b.y,dd=Math.hypot(dx,dy)||1;
  if(cur.move==="chase")moveE(b,dx/dd*b.spd*cur.spd,dy/dd*b.spd*cur.spd,dt);
  else{b.ang+=dt*.55;
    moveE(b,Math.cos(b.ang)*b.spd*cur.spd,Math.sin(b.ang)*b.spd*cur.spd,dt);}
  b.cool-=dt;
  if(b.cool>0)return;
  const mv=cur.moves[b.seq%cur.moves.length];b.seq++;
  b.cool=mv.cd;
  bossMove(b,mv);
}
function bossMove(b,mv){
  const base=Math.atan2(P.y-b.y,P.x-b.x);
  if(mv.m==="radial"){
    const o=rnd(0,1);
    for(let i=0;i<mv.n;i++)eshoot(b,(i+o)/mv.n*6.283,mv.sp,b.dmg*.45);
    burst(b.x,b.y,b.col,14,150);
  }else if(mv.m==="aimed"){
    for(let k=0;k<mv.n;k++)eshoot(b,base+(k-(mv.n-1)/2)*mv.spread,mv.sp,b.dmg*.5);
  }else if(mv.m==="cone"){
    for(let k=0;k<mv.n;k++)eshoot(b,base-mv.arc/2+mv.arc*k/(mv.n-1),mv.sp,b.dmg*.45);
  }else if(mv.m==="spiral"){
    say(b.x,b.y-50,"SPIRAL",b.col,true);
    for(let i=0;i<mv.n;i++)setTimeout(()=>{if(B.on&&!b.dead)
      eshoot(b,i*0.55,mv.sp,b.dmg*.4);},i*55);
  }else if(mv.m==="charge"){
    say(b.x,b.y-50,"CHARGE",b.col,true);
    telegraph(P.x,P.y,40,.45,b.col,()=>{});
    b.vx=Math.cos(base)*330;b.vy=Math.sin(base)*330;b.charge=1.15;
  }else if(mv.m==="slam"){
    const x=P.x,y=P.y;
    telegraph(x,y,mv.r,.85,b.col,()=>{
      explode(x,y,mv.r,b.dmg*.9,b.col);
      if(dist({x,y},P)<mv.r)hurtPlayer(b.dmg*.9);
    });
  }else if(mv.m==="nova"){
    say(b.x,b.y-50,"NOVA",b.col,true);
    const gap=rnd(0,6.283);
    telegraph(b.x,b.y,mv.r,.7,b.col,()=>{
      for(let i=0;i<26;i++){const a=i/26*6.283;
        let df=Math.abs(a-gap);df=Math.min(df,6.283-df);

    });
  }else if(mv.m==="hail"){
    for(let i=0;i<mv.n;i++){

        explode(x,y,30,b.dmg*.6,b.col);

  }else if(mv.m==="seek"){
    for(let i=0;i<mv.n;i++){
      const a=base+rnd(-.8,.8);

    }
  }else if(mv.m==="summon"){
    say(b.x,b.y-50,"SUMMON",b.col,true);
    for(let i=0;i<mv.n;i++)spawn(mv.k);
  }else if(mv.m==="vents"){
    for(let i=0;i<mv.n;i++){
      const x=rnd(50,W-50),y=rnd(TOP+60,H-60);
      B.haz.push(makeHaz("vent",x,y));
    }
    say(b.x,b.y-50,"THE FLOOR OPENS",b.col,true);
  }else if(mv.m==="ice"){
    for(let i=0;i<mv.n;i++)B.haz.push(makeHaz("ice",rnd(60,W-60),rnd(TOP+70,H-90)));
  }else if(mv.m==="mire"){
    for(let i=0;i<mv.n;i++)B.haz.push(makeHaz("mire",rnd(60,W-60),rnd(TOP+70,H-90)));
  }else if(mv.m==="bramble"){
    for(let i=0;i<mv.n;i++)B.haz.push(makeHaz("bramble",rnd(50,W-50),rnd(TOP+60,H-70)));
  }else if(mv.m==="rift"){
    B.haz=B.haz.filter(h=>h.k!=="rift");

/* Each environment has its own two hazards. They hurt enemies too, so you can
   fight over them deliberately instead of only avoiding them. */
const HAZ_BY_BIOME=[["vent","spike"],["ice","slab"],["mire","spike"],
                    ["bramble","slab"],["rift","vent"]];
function hazDmg(){return 11+B.stage*1.5;}
function genHazards(){
  if(B.stage<4)return;
  const bi=clamp(Math.floor((B.stage-1)/10),0,4);
  const kinds=HAZ_BY_BIOME[bi];
  let n=1+Math.floor((B.stage-4)/9);
  if(B.room%10===0)n=Math.min(n,2);
  n=clamp(n,1,4);
  for(let i=0;i<n;i++){
    const k=pick(kinds);
    for(let tries=0;tries<30;tries++){
      const x=rnd(50,W-50),y=rnd(TOP+70,H-150);
      if(Math.hypot(x-P.x,y-P.y)<130||inWall(x,y,30))continue;
      B.haz.push(makeHaz(k,x,y));break;
    }
  }
}
function makeHaz(k,x,y){
  const h={k,x,y,t:rnd(0,3),r:0,w:0,hgt:0};
  if(k==="vent"){h.r=26;h.cyc=2.9;}
  else if(k==="spike"){h.w=rnd(56,96);h.hgt=rnd(30,52);h.cyc=2.3;
    h.x=clamp(x-h.w/2,10,W-h.w-10);h.y=clamp(y-h.hgt/2,TOP+10,H-h.hgt-10);}
  else if(k==="slab"){
    const horiz=Math.random()<.5;
    h.w=horiz?34:52;h.hgt=horiz?52:34;
    h.a={x:horiz?24:x,y:horiz?y:TOP+70};
    h.b={x:horiz?W-24-h.w:x,y:horiz?y:H-70-h.hgt};
    h.x=h.a.x;h.y=h.a.y;h.spd=54+B.stage*1.4;h.dir=1;}
  else if(k==="ice"){h.w=rnd(90,150);h.hgt=rnd(70,120);
    h.x=clamp(x-h.w/2,10,W-h.w-10);h.y=clamp(y-h.hgt/2,TOP+10,H-h.hgt-10);}
  else if(k==="mire"){h.w=rnd(80,130);h.hgt=rnd(60,100);
    h.x=clamp(x-h.w/2,10,W-h.w-10);h.y=clamp(y-h.hgt/2,TOP+10,H-h.hgt-10);}
  else if(k==="bramble"){h.r=rnd(30,46);}
  else if(k==="rift"){h.r=34;h.pull=150+B.stage*3;}
  return h;
}
function inRect(o,x,y,r){return x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.hgt;}
function updateHaz(dt){
  P.onIce=false;P.inMire=false;
  for(const h of B.haz){
    h.t+=dt;
    if(h.k==="vent"){
      const ph=h.t%h.cyc;h.warn=ph>1.9&&ph<2.4;h.fireOn=ph>=2.4&&ph<2.9;
      if(h.fireOn){
        if(!P.hazImmune&&dist(h,P)<h.r+P.r)hazHitPlayer();
        for(const e of B.enemies)if(!e.dead&&dist(h,e)<h.r+e.r&&Math.random()<dt*7)
          hurtEnemy(e,hazDmg()*.9,false,"aoe");
        if(Math.random()<dt*22)B.parts.push({x:h.x+rnd(-h.r,h.r),y:h.y+rnd(-h.r,h.r),
          vx:0,vy:-90,l:.4,col:"#E0703A",s:rnd(2,4)});
      }
    }else if(h.k==="spike"){
      const ph=h.t%h.cyc;h.warn=ph>1.0&&ph<1.35;h.up=ph>=1.35&&ph<2.0;
      if(h.up){
        if(!P.hazImmune&&inRect(h,P.x,P.y,P.r))hazHitPlayer();
        for(const e of B.enemies)if(!e.dead&&inRect(h,e.x,e.y,e.r)&&Math.random()<dt*6)
          hurtEnemy(e,hazDmg()*.8,false,"aoe");
      }
    }else if(h.k==="slab"){
      const tx=h.dir>0?h.b:h.a;
      const dx=tx.x-h.x,dy=tx.y-h.y,d=Math.hypot(dx,dy);
      if(d<3)h.dir*=-1;
      else{h.x+=dx/d*h.spd*dt;h.y+=dy/d*h.spd*dt;}
      if(!P.hazImmune&&inRect(h,P.x,P.y,P.r)){hazHitPlayer();
        const a=Math.atan2(P.y-(h.y+h.hgt/2),P.x-(h.x+h.w/2));
        P.x+=Math.cos(a)*26;P.y+=Math.sin(a)*26;}
      for(const e of B.enemies)if(!e.dead&&inRect(h,e.x,e.y,e.r)&&Math.random()<dt*5)
        hurtEnemy(e,hazDmg()*.7,false,"aoe");
    }else if(h.k==="ice"){
      if(inRect(h,P.x,P.y,P.r))P.onIce=true;
    }else if(h.k==="mire"){
      if(inRect(h,P.x,P.y,P.r)){P.inMire=true;
        if(!P.hazImmune&&Math.random()<dt*2.2)hazTick(hazDmg()*.28);}
      for(const e of B.enemies)if(!e.dead&&inRect(h,e.x,e.y,e.r))e.chill=Math.max(e.chill,.2);
    }else if(h.k==="bramble"){
      if(!P.hazImmune&&dist(h,P)<h.r+P.r){P.inMire=true;
        if(Math.random()<dt*2.6)hazTick(hazDmg()*.34);}
      for(const e of B.enemies)if(!e.dead&&dist(h,e)<h.r+e.r&&Math.random()<dt*3)
        hurtEnemy(e,hazDmg()*.5,false,"aoe");
    }else if(h.k==="rift"){
      const d=dist(h,P);
      if(d<150){const a=Math.atan2(h.y-P.y,h.x-P.x),f=(1-d/150)*h.pull*dt*.5;
        P.x+=Math.cos(a)*f*dt*6;P.y+=Math.sin(a)*f*dt*6;}
      if(!P.hazImmune&&d<h.r*.6&&Math.random()<dt*3)hazTick(hazDmg()*.5);
      for(const e of B.enemies){if(e.dead)continue;const de=dist(h,e);
        if(de<150){const a=Math.atan2(h.y-e.y,h.x-e.x);
          e.x+=Math.cos(a)*(1-de/150)*40*dt;e.y+=Math.sin(a)*(1-de/150)*40*dt;}}
    }
  }
  /* telegraphed attacks resolve here */
  for(let i=B.tels.length-1;i>=0;i--){
    const t=B.tels[i];t.t-=dt;
    if(t.t<=0){if(t.fn)t.fn();B.tels.splice(i,1);}
  }
}
function hazHitPlayer(){
  if(P.inv>0)return;
  hurtPlayer(hazDmg()*(P.hazSoft||1));
}
function hazTick(d){
  if(P.hazSoft)d*=P.hazSoft;
  P.hp-=d;B.dmgTaken+=d;
  if(Math.random()<.3)say(P.x+rnd(-6,6),P.y-16,"-"+Math.round(d),"#FF9A6A");
  if(P.hp<=0){
    if(P.deathSave){P.deathSave=false;P.hp=P.maxhp*.25;P.inv=1.8;}
    else finish(false);
  }
}
function telegraph(x,y,r,delay,col,fn){B.tels.push({x,y,r,t:delay,max:delay,col,fn});}
function inWall(x,y,r){
  for(const w of B.walls)
    if(x+r>w.x&&x-r<w.x+w.w&&y+r>w.y&&y-r<w.y+w.h)return w;
  return null;
}
function ring(x,y,max,col){B.rings.push({x,y,r:max*0.18,max,l:.34,col});}
function burst(x,y,col,n,sp){
  for(let i=0;i<n;i++){const a=rnd(0,6.283),v=rnd(sp*.3,sp);
    B.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.22,.55),col,s:rnd(1.4,3.4)});}
}
function say(x,y,t,col,big){B.texts.push({x,y,t,col,l:.72,big:!!big});}

/* --- input --- */
let stick={on:false,ox:0,oy:0,dx:0,dy:0,mag:0},keys={};
function loc(e){const r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function down(e){if(!B.on||B.paused)return;
  const p=loc(e.touches?e.touches[0]:e);
  if(p.y<TOP+10&&p.x<74){openPause();return;}
  stick.on=true;stick.ox=p.x;stick.oy=p.y;stick.dx=0;stick.dy=0;stick.mag=0;}
function mv(e){if(!stick.on)return;e.preventDefault();
  const p=loc(e.touches?e.touches[0]:e);
  let dx=p.x-stick.ox,dy=p.y-stick.oy,d=Math.hypot(dx,dy);
  if(d>48){dx=dx/d*48;dy=dy/d*48;d=48;}
  stick.dx=dx;stick.dy=dy;stick.mag=Math.min(d/38,1);}
function up(){stick.on=false;stick.mag=0;stick.dx=0;stick.dy=0;}
cv.addEventListener("touchstart",down,{passive:true});
cv.addEventListener("touchmove",mv,{passive:false});
cv.addEventListener("touchend",up);cv.addEventListener("touchcancel",up);
cv.addEventListener("mousedown",down);
window.addEventListener("mousemove",mv);window.addEventListener("mouseup",up);
window.addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;
  if(e.key==="Escape"&&B.on){
    if(B.paused){B.paused=false;$("oPause").classList.remove("on");}else openPause();}});
window.addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;});
function iv(){
  let x=0,y=0;
  if(keys.a||keys.arrowleft)x-=1;if(keys.d||keys.arrowright)x+=1;
  if(keys.w||keys.arrowup)y-=1;if(keys.s||keys.arrowdown)y+=1;
  if(x||y){const m=Math.hypot(x,y);return{x:x/m,y:y/m,mag:1};}
  if(stick.mag>.12){const m=Math.hypot(stick.dx,stick.dy)||1;
    return{x:stick.dx/m,y:stick.dy/m,mag:stick.mag};}
  return{x:0,y:0,mag:0};
}

/* --- attacking --- */
function nearest(from){
  let b=null,d=1e9;const o=from||P;
  for(const e of B.enemies){if(e.dead)continue;const dd=dist(e,o);if(dd<d){d=dd;b=e;}}
  return b;
}
const ELEMS={
 poison:{c:"#A45FD8",g:"#D8B0F0",k:"poison"},
 shock: {c:"#FFD84A",g:"#FFF0A8",k:"shock"},
 ice:   {c:"#7FC4E8",g:"#DAF2FF",k:"ice"},
 fire:  {c:"#FF7A3A",g:"#FFD08A",k:"fire"}
};
function elemOf(){
  let best=null,v=0;
  if((P.poison||0)>v){v=P.poison;best="poison";}
  if((P.shockE||0)>v){v=P.shockE;best="shock";}
  if((P.slow||0)>v){v=P.slow;best="ice";}
  if((P.burn||0)>v){v=P.burn;best="fire";}
  return best?ELEMS[best]:null;
}
let inEcho=false;
function lance(a,ox,oy){
  const crit=Math.random()<critNow();
  const dmg=P.atk*(crit?P.cdmg:1)*1.15;
  let x=P.x+(ox||0), y=P.y+(oy||0), ang=a;
  let bounces=P.bounce;
  const pts=[{x,y}];
  const hitList=[];
  const STEP=5, MAXLEN=1500, turn=(P.seek||0)*0.020;
  let travelled=0;
  while(travelled<MAXLEN){
    /* Tracking bends the beam toward whatever it has not hit yet */
    if(turn>0){
      let t=null,bd=1e9;
      for(const e of B.enemies){
        if(e.dead||hitList.indexOf(e)>=0)continue;
        const d2=Math.hypot(e.x-x,e.y-y);
        if(d2<bd){bd=d2;t=e;}
      }
      if(t&&bd<330){
        const ta=Math.atan2(t.y-y,t.x-x);
        let df=((ta-ang+Math.PI*3)%(Math.PI*2))-Math.PI;
        ang+=clamp(df,-turn,turn);
      }
    }
    const nx=x+Math.cos(ang)*STEP, ny=y+Math.sin(ang)*STEP;
    let bounced=false;
    if(nx<6||nx>W-6){if(bounces>0){bounces--;ang=Math.PI-ang;bounced=true;}else break;}
    else if(ny<TOP+6||ny>H-6){if(bounces>0){bounces--;ang=-ang;bounced=true;}else break;}
    else if(inWall(nx,ny,3)){
      if(bounces>0){bounces--;
        if(!inWall(x+Math.cos(Math.PI-ang)*STEP,ny,3))ang=Math.PI-ang;else ang=-ang;
        bounced=true;
      }else break;
    }
    if(bounced){pts.push({x,y});continue;}
    x=nx;y=ny;travelled+=STEP;
    pts.push({x,y});
    for(const e of B.enemies){
      if(e.dead||hitList.indexOf(e)>=0)continue;
      if(Math.hypot(e.x-x,e.y-y)<e.r+7*P.size){
        hitList.push(e);
        hurtEnemy(e,dmg,crit);
        if(P.slow&&Math.random()<P.slow)e.chill=1.6;
        if(P.burn&&Math.random()<P.burn)e.fire=2.4;
        if(P.poison&&Math.random()<P.poison)e.poison=3.2;
        if(P.shockE&&Math.random()<P.shockE)e.shock=2.2;
      }
    }
  }
  B.lasers.push({pts,l:.42,max:.42,crit,w:9*P.size,el:elemOf()});
  B.shake=Math.max(B.shake,2.2);
}
function fire(){
  const tg=nearest();
  if(tg)P.aim=Math.atan2(tg.y-P.y,tg.x-P.x);
  if(P.hero.id==="sable")P.ghost=0;
  const wc=P.wc;
  if(wc==="blade"){swing(P.aim);return;}
  if(P.beamWeapon){
    const tg0=nearest();
    if(tg0)P.aim=Math.atan2(tg0.y-P.y,tg0.x-P.x);
    P.combo++;
    const n=1+P.multi;
    const gp=(P.gap||15), px2=-Math.sin(P.aim), py2=Math.cos(P.aim);
    for(let i=0;i<n;i++){const o=(i-(n-1)/2)*gp;
      lance(P.aim,px2*o,py2*o);}
    for(let k=0;k<P.diag;k++){const off=0.30+k*0.22;
      lance(P.aim+off,0,0);lance(P.aim-off,0,0);}
    if(P.rear)for(let i=0;i<n;i++){const o=(i-(n-1)/2)*gp;
      lance(P.aim+Math.PI,px2*o,py2*o);}
    if(P.side){lance(P.aim+1.5708,0,0);lance(P.aim-1.5708,0,0);}
    P.recoil=1;
    if(P.dbl&&!inEcho)P.echoT=0.11;
    return;
  }
  let n=P.base+P.multi;
  let extraPierce=0;
  P.combo++;
  if((P.hero.id==="wren"||P.sunburst)&&P.combo%4===0){n+=2;extraPierce=2;}
  P.fsBonus=(P.firstStrike&&P.wind<0.55)?2:1;
  if(hasSkill("hbow")&&P.wc==="bow"&&P.combo%3===0)extraPierce+=1;
  /* every extra shot flies PARALLEL, offset sideways - no fan, no misses */
  const gap=P.gap||13, px=-Math.sin(P.aim), py=Math.cos(P.aim);
  for(let i=0;i<n;i++){const o=(i-(n-1)/2)*gap;shoot(P.aim,extraPierce,px*o,py*o);}
  if(P.rear)for(let i=0;i<n;i++){const o=(i-(n-1)/2)*gap;
    shoot(P.aim+Math.PI,extraPierce,px*o,py*o);}
  if(P.side){shoot(P.aim+1.5708,extraPierce,0,0);shoot(P.aim-1.5708,extraPierce,0,0);}
  /* narrow enough that Tracking can curve them onto the same target */
  for(let k=0;k<P.diag;k++){
    const off=0.30+k*0.22;
    shoot(P.aim+off,extraPierce,0,0);
    shoot(P.aim-off,extraPierce,0,0);}
  P.recoil=1;
  if(P.dbl&&!inEcho)P.echoT=0.11;
  burst(P.x+Math.cos(P.aim)*13,P.y+Math.sin(P.aim)*13,B.bio.tint,3,70);
}
function shoot(a,extraPierce,ox,oy){
  let crit=Math.random()<critNow();
  if(P.oracleSix&&P.combo%6===0)crit=true;
  let dmg=P.atk*(crit?P.cdmg:1)*(P.fsBonus||1);
  const s={x:P.x+(ox||0),y:P.y+(oy||0),vx:Math.cos(a)*P.pspd,vy:Math.sin(a)*P.pspd,
    dmg,crit,r:3.6*P.size,life:P.plife*P.range,kind:P.wc,
    pierce:P.pierce+(extraPierce||0)+((crit&&P.critPierce)?1:0)+
      ((P.oracleSix&&P.combo%6===0)?90:0),
    bounce:P.bounce,hit:[],t:0,home:P.seek||0,tr:[]};
  if(P.wc==="spear"){s.pierce=99;s.r=4.6*P.size;}
  if(P.wc==="orb"||P.wc==="staff"){s.r=7*P.size;}
  if(P.wc==="chakram"){s.r=8*P.size;s.back=false;s.ox=P.x;s.oy=P.y;}
  if(P.wc==="dagger")s.r=3*P.size;
  B.shots.push(s);
}
function critNow(){
  let c=P.crit;
  if(hasSkill("ospear")&&P.wc==="spear")c+=Math.min(P.comboCrit,5)*0.06;
  return c;
}
function swing(a){
  const crit=Math.random()<critNow();
  let dmg=P.atk*(crit?P.cdmg:1);
  B.swings.push({a,t:0,life:.18,r:(54+P.multi*11)*P.size*P.range,dmg,crit,hit:[]});
  if(P.rear)B.swings.push({a:a+Math.PI,t:0,life:.18,r:54*P.size,dmg:dmg*.7,crit,hit:[]});
  B.shake=Math.max(B.shake,2);
}
function explode(x,y,rad,dmg,col){
  ring(x,y,rad*1.5,col||B.bio.tint);
  burst(x,y,col||B.bio.tint,14,200);B.shake=Math.max(B.shake,3);
  for(const e of B.enemies){if(e.dead)continue;
    if(dist({x,y},e)<rad+e.r)hurtEnemy(e,dmg,false,"aoe");}
}
function hurtEnemy(e,dmg,crit,src){
  if(e.ward>0){e.ward--;say(e.x,e.y-e.r-6,"WARD","#7FC4E8",true);
    ring(e.x,e.y,e.r*3,"#7FC4E8");return;}
  if(P.cull&&e.hp>e.maxhp*0.8)dmg*=1+P.cull;
  if(P.fullHpDmg&&P.hp>=P.maxhp*0.99)dmg*=1+P.fullHpDmg;
  if(P.momBonus)dmg*=1+P.momBonus;
  if(crit&&P.critSplash&&src!=="aoe"){
    for(const o of B.enemies)if(o!==e&&!o.dead&&dist(o,e)<52)
      hurtEnemy(o,dmg*P.critSplash,false,"aoe");
    if(P.critRefund)P.fireT-=P.critRefund;
  }
  if(P.focus)dmg*=1+Math.min(P.wind*P.focus,P.focus*5);
  if(P.exec&&e.kind!=="boss"&&e.hp<e.maxhp*P.exec)dmg=e.hp+1;
  if(hasSkill("vscythe")&&P.wc==="blade"&&e.kind!=="boss"&&e.hp<e.maxhp*0.18){
    dmg=e.hp+1;P.fireT=0;say(e.x,e.y-20,"REAP","#F04FA0",true);}
  if(hasSkill("tfang")&&P.wc==="dagger"&&e.hp<e.maxhp*0.3)dmg*=2;
  e.hp-=dmg;e.hit=.12;
  if(crit)ring(e.x,e.y,34,"#FFD27A");
  say(e.x+rnd(-4,4),e.y-e.r-4,Math.round(dmg),crit?"#FFD27A":"#E8DFC8",crit);
  burst(e.x,e.y,e.col,crit?7:3,110);
  if(src!=="aoe"&&src!=="chain"){
    P.comboCrit+=0.2;
    if(P.life>0)heal(dmg*P.life);
    if(P.chain>0&&Math.random()<P.chain){
      let t=null,d=115;
      for(const o of B.enemies)if(o!==e&&!o.dead){const dd=dist(o,e);if(dd<d){d=dd;t=o;}}
      if(t){B.parts.push({arc:1,x:e.x,y:e.y,x2:t.x,y2:t.y,l:.14,col:"#9FD7FF"});
        hurtEnemy(t,P.atk*0.5,false,"chain");}
    }
  }
  if(e.hp<=0&&!e.dead)killEnemy(e);
}
function countFree(){return P.boons.filter(b=>!b.angel).length;}
function xpNeed(lv){return Math.round(32*Math.pow(1.44,lv-1));}
function gainXP(v){
  /* deeper rooms give less experience, so most boons land in the first half */
  const decay=clamp(1.05-B.room*0.0155,0.22,1);
  P.xp+=v*(1+(P.xpBoost||0))*decay;
  while(P.xp>=xpNeed(P.level)){
    P.xp-=xpNeed(P.level);P.level++;
    if(B.mode==='rush'){P.atk*=1.05;say(P.x,P.y-42,"+5% ATK","#E8A22B",true);}
    else if(P.freeBoons()>=12){P.atk*=1.08;say(P.x,P.y-42,"+8% ATK","#E8A22B",true);}
    else P.pending++;
    burst(P.x,P.y,"#9FE1CB",18,190);ring(P.x,P.y,70,"#9FE1CB");
    say(P.x,P.y-52,"LEVEL "+P.level,"#9FE1CB",true);
  }
}
function heal(v){
  if(P.leechShield&&P.hp>=P.maxhp*0.99&&P.barrierMax){
    P.barrier=Math.min(P.barrierMax*1.5,P.barrier+v);return;}
  let cap=P.maxhp;
  if(P.healCap)cap=Math.max(P.hp,P.maxhp*P.healCap);
  P.hp=Math.min(cap,P.hp+v);
}
function killEnemy(e){
  e.dead=true;B.kills++;
  burst(e.x,e.y,e.col,e.kind==="boss"?34:16,e.kind==="boss"?300:190);
  ring(e.x,e.y,e.kind==="boss"?150:52,e.col);
  B.corpses.push({x:e.x,y:e.y,r:e.r,col:e.col,l:.42,max:.42});
  for(let i=0;i<(e.kind==="boss"?18:7);i++)
    B.parts.push({x:e.x,y:e.y,vx:rnd(-40,40),vy:rnd(-110,-40),
      l:rnd(.4,.8),col:"#E0703A",s:rnd(1.5,3)});
  B.shake=Math.max(B.shake,e.kind==="boss"?15:3);
  if(P.hero.id==="kaz")P.rush=1.2;
  else if(P.setFury)P.rush=Math.max(P.rush,2.0);
  const g=Math.round(e.gold*(1+B.stage*0.12)),n=Math.min(g,10);
  for(let i=0;i<n;i++)B.orbs.push({x:e.x,y:e.y,vx:rnd(-70,70),vy:rnd(-80,10),
    v:Math.ceil(g/n),t:0});
  const heartOdds=P.hp<P.maxhp*0.45?0.16:0.07;
  if(e.kind==="boss"||Math.random()<heartOdds)
    B.orbs.push({x:e.x,y:e.y,vx:rnd(-50,50),vy:rnd(-70,0),v:0,t:0,heart:1});
  const xv=(e.kind==="boss"?(e.named?150:80):Math.max(2,Math.round(e.gold*1.3)))
    *(e.elite?2.2:1);
  const xn=clamp(Math.round(xv/3),2,8);
  for(let i=0;i<xn;i++)B.orbs.push({x:e.x,y:e.y,vx:rnd(-85,85),vy:rnd(-95,10),
    v:Math.ceil(xv/xn),t:0,xp:1});
  if(e.kind==="splitter")for(let i=0;i<2;i++){
    const s=spawn("shard",{x:e.x+rnd(-14,14),y:e.y+rnd(-14,14)});s.vx=rnd(-40,40);}
  if(e.elite==="volatile"){
    const x=e.x,y=e.y,dm=e.dmg*1.4;
    telegraph(x,y,64,0.45,"#E0703A",()=>{
      explode(x,y,64,0,"#E0703A");
      if(dist({x,y},P)<70)hurtPlayer(dm);});
  }
  if(e.elite){B.eliteKills=(B.eliteKills||0)+1;
    B.orbs.push({x:e.x,y:e.y,vx:rnd(-50,50),vy:rnd(-80,0),v:0,t:0,heart:1});}
  if(P.kburst)explode(e.x,e.y,52,P.atk*P.kburst,"#E0703A");
  if(P.killHeal)heal(P.maxhp*P.killHeal);
  if(P.umbralSix)explode(e.x,e.y,72,P.atk*0.75,"#9B5FD0");
  if(e.kind==="boss")B.flash=.4;
}
function hurtPlayer(d){
  if(P.inv>0||P.ghost>0)return;
  if(P.guard){P.guard=0;say(P.x,P.y-22,"WARDED","#7FC4E8",true);
    ring(P.x,P.y,60,"#7FC4E8");P.inv=.6;return;}
  if(P.dodge>0&&Math.random()<P.dodge){say(P.x,P.y-20,"miss","#9FD7FF");
    P.inv=.25;if(P.dodgeGhost)P.ghost=1.0;return;}
  if(P.shield>0){P.shield=0;P.inv=.5;say(P.x,P.y-20,"block","#7FC4E8",true);
    burst(P.x,P.y,"#7FC4E8",12,150);return;}
  let m=P.mit;
  if(hasSkill("plate")&&iv().mag<0.12)m*=0.90;
  if(P.rooted)m*=1-Math.min(0.35,P.wind*0.18);
  d*=m;
  if(P.barrier>0){
    const soak=Math.min(P.barrier,d);P.barrier-=soak;d-=soak;
    ring(P.x,P.y,42,"#7FC4E8");say(P.x,P.y-26,"-"+Math.round(soak),"#7FC4E8");
    if(d<=0){P.inv=.4;return;}
  }
  P.hp-=d;P.inv=.55;B.shake=9;B.flash=Math.min(1,B.flash+.32);
  if(P.duskweave)P.dusk=1.5;
  if(P.fnova){ring(P.x,P.y,120,"#7FC4E8");
    for(const e of B.enemies)if(!e.dead&&dist(e,P)<120)e.chill=Math.max(e.chill,1.4*P.fnova);}
  ring(P.x,P.y,46,"#C0364B");
  B.dmgTaken+=d;P.comboCrit=0;
  say(P.x,P.y-20,"-"+Math.round(d),"#FF7A8A",true);
  if(P.hp<=0){
    if(P.lives>0){P.lives--;P.hp=P.maxhp*.5;P.inv=2.2;P.barrier=P.barrierMax;
      burst(P.x,P.y,"#6FAF8C",40,300);ring(P.x,P.y,190,"#6FAF8C");
      say(P.x,P.y-34,"SECOND LIFE","#6FAF8C",true);}
    else if(P.deathSave){P.deathSave=false;P.hp=P.maxhp*.25;P.inv=1.8;
      burst(P.x,P.y,"#E8A22B",30,240);say(P.x,P.y-32,"SPARED","#E8A22B",true);}
    else finish(false);
  }
}

/* --- update --- */
function update(dt){
  B.t+=dt;B.shake=Math.max(0,B.shake-dt*19);B.flash=Math.max(0,B.flash-dt*1.7);
  P.inv=Math.max(0,P.inv-dt);P.rush=Math.max(0,P.rush-dt);
  if(P.dusk>0)P.dusk-=dt;
  updateHaz(dt);
  P.ghost=Math.max(0,P.ghost-dt);
  if(P.shieldT){P.shieldCd=(P.shieldCd||0)+dt;
    if(P.shieldCd>=P.shieldT){P.shieldCd=0;P.shield=1;}}

  const v=iv(),moving=v.mag>.12;
  P.recoil=Math.max(0,P.recoil-dt*4);
  P.mv=moving?Math.min(1,P.mv+dt*4.5):Math.max(0,P.mv-dt*4.5);
  if(moving)P.face=Math.atan2(v.y,v.x);
  let canFire=false,mul=1;
  const hasFoes=B.enemies.length>0;
  if(P.rage>0&&P.hp<P.maxhp*.5)mul*=1+P.rage;
  if(P.rush>0)mul*=(P.hero.id==="kaz"?1.6:1.25);
  const mire=P.inMire?0.55:1;
  const sp=P.spd*v.mag*(P.dusk>0?1.4:1)*mire;
  const grip=P.onIce?2.4:26;
  P.vx=(P.vx||0)+((moving?v.x*sp:0)-(P.vx||0))*Math.min(1,grip*dt);
  P.vy=(P.vy||0)+((moving?v.y*sp:0)-(P.vy||0))*Math.min(1,grip*dt);
  if(Math.abs(P.vx)>1||Math.abs(P.vy)>1){
    const nx=P.x+P.vx*dt,ny=P.y+P.vy*dt;
    if(!inWall(nx,P.y,P.r))P.x=nx;else P.vx=0;
    if(!inWall(P.x,ny,P.r))P.y=ny;else P.vy=0;
    P.x=clamp(P.x,P.r+7,W-P.r-7);P.y=clamp(P.y,TOP+P.r+7,H-P.r-7);
  }
  if(moving){
    P.moveT+=dt;
    if(P.hero.id==="sable"&&P.moveT>1.2)P.ghost=.2;
    P.wind=0;P.windBlast=1;
    if(P.emberTrail){P.trailT=(P.trailT||0)+dt;
      if(P.trailT>0.14){P.trailT=0;B.fires.push({x:P.x,y:P.y,l:2.2,r:16});}}
    if(P.hero.auto||P.tempestSix){canFire=true;
      mul*=(P.hero.auto?(P.tempestSix?0.85:(P.autoRate||0.55)):0.6);}
  }else{
    P.moveT=0;
    if(P.windBlast&&hasSkill("cstep")){P.windBlast=0;
      explode(P.x,P.y,70,P.atk*0.8,"#9FD7FF");
      for(const e of B.enemies){const d=dist(e,P);if(d<80){
        const a=Math.atan2(e.y-P.y,e.x-P.x);e.x+=Math.cos(a)*30;e.y+=Math.sin(a)*30;}}}
    P.wind+=dt;
    if(P.wind>.16)canFire=true;else P.fireT=Math.min(P.fireT,.4);
  }
  if(canFire&&hasFoes){P.fireT-=dt*P.rate*mul;
    if(P.fireT<=0){P.fireT=1;fire();}}
  if(P.stillRegen&&P.wind>1)heal(P.stillRegen*dt);
  if(P.momentum)P.momBonus=Math.min(P.momentum,P.moveT*0.10);
  if(P.echoT>0){P.echoT-=dt;
    if(P.echoT<=0){inEcho=true;fire();inEcho=false;}}
  if(P.orbN>0){
    P.orbA+=dt*2.3;
    for(let i=0;i<P.orbN;i++){
      const a=P.orbA+i/P.orbN*6.283;
      const ox=P.x+Math.cos(a)*48,oy=P.y+Math.sin(a)*48;
      const orbR=P.orbBig?15:9;
      for(const e of B.enemies){
        if(e.dead)continue;
        if(Math.hypot(ox-e.x,oy-e.y)<e.r+orbR){
          e.orbT=(e.orbT||0)-dt;
          if(e.orbT<=0){e.orbT=.5;hurtEnemy(e,P.atk*0.55,false,"aoe");
            burst(ox,oy,"#9FD7FF",4,90);}
        }
      }
    }
  }
  if(P.slowZone){
    const rad=P.slowZone>1?215:150, mulS=P.slowZone>1?0.42:0.55;
    for(const s of B.eshots)if(!s.slowed&&dist(s,P)<rad){
      s.slowed=1;s.vx*=mulS;s.vy*=mulS;}
  }
  if(P.aura>0){P.auraT=(P.auraT||0)+dt;
    if(P.auraT>0.3){P.auraT=0;
      for(const e of B.enemies)if(!e.dead&&dist(e,P)<62+P.aura*8)
        hurtEnemy(e,P.atk*P.aura*0.3,false,"aoe");}}

  /* swings */
  for(let i=B.swings.length-1;i>=0;i--){
    const s=B.swings[i];s.t+=dt;
    for(const e of B.enemies){
      if(e.dead||s.hit.indexOf(e)>=0)continue;
      const d=dist(e,P);if(d>s.r+e.r)continue;
      const a=Math.atan2(e.y-P.y,e.x-P.x);
      let da=Math.abs(((a-s.a+Math.PI*3)%(Math.PI*2))-Math.PI);
      if(da<1.15){s.hit.push(e);hurtEnemy(e,s.dmg,s.crit);
        if(P.slow&&Math.random()<P.slow)e.chill=1.6;
        if(P.burn&&Math.random()<P.burn)e.fire=2.4;
        if(P.poison&&Math.random()<P.poison)e.poison=3.2;
        if(P.shockE&&Math.random()<P.shockE)e.shock=2.2;}
    }
    if(s.t>=s.life)B.swings.splice(i,1);
  }

  /* player shots */
  for(let i=B.shots.length-1;i>=0;i--){
    const s=B.shots[i];s.t+=dt;
    if(s.kind==="chakram"){
      if(!s.back&&s.t>s.life*.5){s.back=true;s.hit=[];}
      if(s.back){const a=Math.atan2(P.y-s.y,P.x-s.x);
        s.vx=Math.cos(a)*P.pspd*1.15;s.vy=Math.sin(a)*P.pspd*1.15;}
    }
    if(s.home>0&&!(s.kind==="chakram"&&s.back)){const t=nearest(s);
      if(t){const a=Math.atan2(t.y-s.y,t.x-s.x),cs=Math.hypot(s.vx,s.vy);
        s.vx+=Math.cos(a)*cs*s.home*dt;s.vy+=Math.sin(a)*cs*s.home*dt;
        const m=Math.hypot(s.vx,s.vy);s.vx=s.vx/m*cs;s.vy=s.vy/m*cs;}}
    if(s.tr){s.tr.push(s.x,s.y);if(s.tr.length>12)s.tr.splice(0,2);}
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    let gone=s.life<=0;
    if(s.kind==="chakram"&&s.back&&dist(s,P)<16)gone=true;
    if(s.x<5||s.x>W-5){if(s.bounce>0){s.bounce--;s.vx*=-1;s.x=clamp(s.x,6,W-6);}
      else if(s.kind!=="chakram")gone=true;else s.vx*=-1;}
    if(s.y<TOP+5||s.y>H-5){if(s.bounce>0){s.bounce--;s.vy*=-1;s.y=clamp(s.y,TOP+6,H-6);}
      else if(s.kind!=="chakram")gone=true;else s.vy*=-1;}
    const w=inWall(s.x,s.y,s.r);
    if(w&&!gone){
      if(s.bounce>0){s.bounce--;const cx=w.x+w.w/2,cy=w.y+w.h/2;
        if(Math.abs(s.x-cx)/w.w>Math.abs(s.y-cy)/w.h)s.vx*=-1;else s.vy*=-1;
        s.x+=s.vx*dt*2;s.y+=s.vy*dt*2;}
      else if(s.kind!=="chakram"){burst(s.x,s.y,"#8A8299",4,70);gone=true;}
    }
    if(!gone)for(const e of B.enemies){
      if(e.dead||s.hit.indexOf(e)>=0)continue;
      if(dist(s,e)<e.r+s.r){
        s.hit.push(e);
        let dmg=s.dmg;
        if(s.kind==="chakram"&&s.back&&hasSkill("chak"))dmg*=1.5;
        hurtEnemy(e,dmg,s.crit);
        if(P.slow&&Math.random()<P.slow)e.chill=1.6;
        if(P.burn&&Math.random()<P.burn)e.fire=2.4;
        if(P.poison&&Math.random()<P.poison)e.poison=3.2;
        if(P.shockE&&Math.random()<P.shockE)e.shock=2.2;
        if(P.scrap||P.sunburst)explode(s.x,s.y,(P.sunburst>1?52:34)*P.size,
          s.dmg*(P.sunburst>1?.7:.45));
        if(s.kind==="staff"){
          explode(s.x,s.y,44*P.size,s.dmg*.65);
          if(hasSkill("sgrim"))meteor();
          if(P.alwaysSplit||(P.hero.id==="mira"&&Math.random()<.35))motes(s.x,s.y,s.dmg*.4);
          gone=true;
        }else if(s.kind==="chakram"){/* pierces */}
        else if(s.pierce>0)s.pierce--;else gone=true;
        break;
      }
    }
    if(gone)B.shots.splice(i,1);
  }

  /* pets */
  for(const pet of B.pets){
    pet.t+=dt;
    if(pet.dead){pet.resp-=dt;if(pet.resp<=0){pet.dead=false;pet.x=P.x;pet.y=P.y;}continue;}
    const tg=nearest(pet);
    if(tg){const a=Math.atan2(tg.y-pet.y,tg.x-pet.x);
      pet.x+=Math.cos(a)*150*dt;pet.y+=Math.sin(a)*150*dt;
      pet.cool-=dt;
      if(dist(pet,tg)<tg.r+pet.r&&pet.cool<=0){pet.cool=.7;
        hurtEnemy(tg,P.atk*.55,false,"aoe");burst(pet.x,pet.y,"#8FA0C4",5,120);}
    }else{const a=Math.atan2(P.y-pet.y,P.x-pet.x);
      if(dist(pet,P)>34){pet.x+=Math.cos(a)*130*dt;pet.y+=Math.sin(a)*130*dt;}}
  }

  /* enemies */
  for(let i=B.enemies.length-1;i>=0;i--){
    const e=B.enemies[i];
    if(e.dead){B.enemies.splice(i,1);continue;}
    e.t+=dt;e.hit=Math.max(0,e.hit-dt);e.born=Math.min(1,e.born+dt*4);
    if(e.chill>0)e.chill-=dt;
    if(e.elite==="jugg")e.chill=0;
    if(e.elite==="regen"&&e.hp<e.maxhp)e.hp=Math.min(e.maxhp,e.hp+e.maxhp*0.022*dt);
    if(e.poison>0){e.poison-=dt;e.hp-=dt*P.atk*.22;
      if(Math.random()<.2)B.parts.push({x:e.x+rnd(-6,6),y:e.y+rnd(-6,6),
        vx:0,vy:-22,l:.3,col:"#8FBF6A",s:2});
      if(e.hp<=0){killEnemy(e);continue;}}
    if(e.shock>0){e.shock-=dt;
      if(Math.random()<dt*3){
        let t=null,dd=100;
        for(const o of B.enemies)if(o!==e&&!o.dead){const q=dist(o,e);if(q<dd){dd=q;t=o;}}
        if(t){B.parts.push({arc:1,x:e.x,y:e.y,x2:t.x,y2:t.y,l:.1,col:"#9FD7FF"});
          hurtEnemy(t,P.atk*0.25,false,"chain");}
        hurtEnemy(e,P.atk*0.2,false,"aoe");
        if(e.dead)continue;
      }}
    if(e.fire>0){e.fire-=dt;e.hp-=dt*P.atk*.3;
      if(Math.random()<.28)B.parts.push({x:e.x+rnd(-6,6),y:e.y+rnd(-6,6),
        vx:0,vy:-30,l:.3,col:"#E0703A",s:2});
      if(e.hp<=0){killEnemy(e);continue;}}
    const sf=e.chill>0?.45:1;
    const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;

    /* camping pressure: the longer you stand still, the harder they push */
    const camp=clamp((P.wind-1.2)/2.5,0,1);
    const agg=1+camp*0.5;

    if(e.kind==="chaser"||e.kind==="shard"){
      if(e.lunge>0){e.lunge-=dt;moveE(e,e.vx,e.vy,dt);
        if(e.lunge<=0)e.cool=rnd(1.6,2.6);}
      else if(e.wind>0){
        e.wind-=dt;moveE(e,-ux*22*sf,-uy*22*sf,dt);
        if(e.wind<=0){e.vx=ux*330;e.vy=uy*330;e.lunge=.42;
          burst(e.x,e.y,e.col,7,120);}
      }else{
        moveE(e,ux*e.spd*sf*agg,uy*e.spd*sf*agg,dt);
        e.cool-=dt*sf*agg*(e.haste||1);
        if(e.cool<=0&&d<200&&d>34){e.cool=99;e.wind=.34;
          ring(e.x,e.y,30,e.col);}
      }
    }else if(e.kind==="tank"){
      moveE(e,ux*e.spd*sf,uy*e.spd*sf,dt);
      e.cool-=dt*sf*(e.haste||1);
      if(e.cool<=0&&d<110){e.cool=rnd(3.0,4.0);slam(e,86,e.dmg*1.1);}
    }else if(e.kind==="splitter"){
      const wnt=d<120?-1:1;
      moveE(e,ux*e.spd*wnt*sf,uy*e.spd*wnt*sf,dt);
      e.cool-=dt*sf*agg*(e.haste||1);
      if(e.cool<=0){e.cool=rnd(2.2,3.2);lob(e,e.dmg*.75);}
    }else if(e.kind==="shooter"){
      /* strafes instead of standing, and leads its shots */
      e.ang+=dt*(e.strafe||1)*0.9;
      const want=d<140?-1:d>210?1:0;
      const px=-uy,py=ux;
      moveE(e,(ux*want+px*(e.strafe||1)*0.75)*e.spd*sf,
              (uy*want+py*(e.strafe||1)*0.75)*e.spd*sf,dt);
      if(Math.random()<dt*0.4)e.strafe=(e.strafe||1)*-1;
      e.cool-=dt*sf*agg*(e.haste||1);
      if(e.cool<=0){
        e.burst=3;e.cool=rnd(2.0,2.8);
      }
      if(e.burst>0){e.bt=(e.bt||0)-dt;
        if(e.bt<=0){e.bt=.16;e.burst--;
          eshoot(e,aimAt(e,175,0.35),175,e.dmg*.45);}}
    }else if(e.kind==="orbiter"){
      e.ang+=dt*1.7*sf*agg;
      const a=Math.atan2(P.y+Math.sin(e.ang)*115-e.y,P.x+Math.cos(e.ang)*115-e.x);
      moveE(e,Math.cos(a)*e.spd*sf*agg,Math.sin(a)*e.spd*sf*agg,dt);
      e.cool-=dt*sf*agg*(e.haste||1);
      if(e.cool<=0){e.cool=rnd(2.6,3.6);
        if(Math.random()<.5)tornado(e,Math.atan2(dy,dx),e.dmg*.32);
        else{const b=aimAt(e,175,.3);
          for(let k=-1;k<=1;k++)eshoot(e,b+k*.24,175,e.dmg*.55);}}
    }else if(e.kind==="hexer"){
      const wnt=d<170?-1:d>250?1:0;
      moveE(e,ux*e.spd*wnt*sf,uy*e.spd*wnt*sf,dt);
      e.cool-=dt*sf*agg*(e.haste||1);
      if(e.cool<=0){e.cool=rnd(3.0,4.0);
        beam(e,Math.atan2(dy,dx),e.dmg*1.25,0.8);}
    }else if(e.kind==="axeman"){
      const wnt=d<150?-1:d>230?1:0;
      moveE(e,ux*e.spd*wnt*sf,uy*e.spd*wnt*sf,dt);
      e.cool-=dt*sf*agg*(e.haste||1);
      if(e.cool<=0){e.cool=rnd(2.2,3.0);
        const b=aimAt(e,190,.4);
        throwAxe(e,b,e.dmg*.85);
        if(B.stage>=22)throwAxe(e,b+0.5,e.dmg*.85);}
    }else if(e.kind==="stormcaller"){
      const wnt=d<200?-1:d>280?1:0;
      moveE(e,ux*e.spd*wnt*sf*.8,uy*e.spd*wnt*sf*.8,dt);
      e.cool-=dt*sf*agg*(e.haste||1);
      if(e.cool<=0){e.cool=rnd(3.2,4.2);
        const b=Math.atan2(dy,dx);
        for(let k=-1;k<=1;k++)tornado(e,b+k*.4,e.dmg*.3);}
    }else if(e.kind==="lancer"){
      if(e.dash>0){e.dash-=dt;moveE(e,e.vx,e.vy,dt);
        if(Math.random()<dt*30)B.parts.push({x:e.x,y:e.y,vx:0,vy:0,l:.25,col:e.col,s:3});}
      else if(e.wind>0){e.wind-=dt;
        if(e.wind<=0){e.vx=ux*360;e.vy=uy*360;e.dash=.6;}}
      else{moveE(e,ux*e.spd*.55*sf,uy*e.spd*.55*sf,dt);
        e.cool-=dt*sf*agg*(e.haste||1);
        if(e.cool<=0&&d<250){e.cool=rnd(1.9,2.7);e.wind=.32;
          ring(e.x,e.y,40,e.col);burst(e.x,e.y,e.col,6,90);}}
    }else if(e.kind==="boss"){
      if(e.named){
        bossScript(e,dt);
        if(e.drain>0){e.drain-=dt;
          if(Math.random()<dt*4&&d<210){hurtPlayer(e.dmg*.18);
            e.hp=Math.min(e.maxhp,e.hp+e.dmg*.4);
            B.parts.push({arc:1,x:P.x,y:P.y,x2:e.x,y2:e.y,l:.12,col:"#C0364B"});}}
      }else bossAI(e,dt,ux,uy,d,sf);
    }

    const melee=(e.kind==="chaser"||e.kind==="shard"||e.kind==="tank"||
                 e.kind==="lancer"||e.kind==="boss");
    if(melee&&d<e.r+P.r+1){
      const before=P.hp;hurtPlayer(e.dmg);
      if(e.elite==="vampiric"&&P.hp<before)
        e.hp=Math.min(e.maxhp,e.hp+e.dmg*2.2);
      if(P.thorn>0)hurtEnemy(e,e.dmg*P.thorn,false,"aoe");}
  }

  /* enemy shots */
  for(let i=B.eshots.length-1;i>=0;i--){
    const s=B.eshots[i];
    s.t+=dt;s.spin=(s.spin||0)+dt*14;
    if(s.kind==="lobshadow"){if(s.life-dt<=0)B.eshots.splice(i,1);else s.life-=dt;continue;}
    if(s.kind==="axe"){
      const o=s.owner;
      if(s.out&&s.t>0.75)s.out=false;
      if(!s.out&&o&&!o.dead){
        const a=Math.atan2(o.y-s.y,o.x-s.x);
        s.vx+=Math.cos(a)*900*dt;s.vy+=Math.sin(a)*900*dt;
        const m=Math.hypot(s.vx,s.vy);
        if(m>260){s.vx=s.vx/m*260;s.vy=s.vy/m*260;}
        if(dist(s,o)<16){B.eshots.splice(i,1);continue;}
      }
      s.hitT=Math.max(0,(s.hitT||0)-dt);
      s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
      if(s.life<=0){B.eshots.splice(i,1);continue;}
      if(s.hitT<=0&&dist(s,P)<P.r+s.r){s.hitT=.6;hurtPlayer(s.dmg);}
      continue;
    }
    if(s.kind==="tornado"){
      const a=Math.atan2(P.y-s.y,P.x-s.x),m=Math.hypot(s.vx,s.vy);
      s.vx+=Math.cos(a)*m*s.seek*dt;s.vy+=Math.sin(a)*m*s.seek*dt;
      const nm=Math.hypot(s.vx,s.vy);s.vx=s.vx/nm*m;s.vy=s.vy/nm*m;
      s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
      if(s.life<=0){burst(s.x,s.y,"#9FD7FF",10,120);B.eshots.splice(i,1);continue;}
      s.hitT=Math.max(0,(s.hitT||0)-dt);
      if(dist(s,P)<P.r+s.r){
        const pa=Math.atan2(P.y-s.y,P.x-s.x);
        P.vx=(P.vx||0)+Math.cos(pa)*260*dt*6;P.vy=(P.vy||0)+Math.sin(pa)*260*dt*6;
        if(s.hitT<=0){s.hitT=.45;hurtPlayer(s.dmg);}
      }
      continue;
    }
    if(s.curve){const a=Math.atan2(s.vy,s.vx)+s.curve*dt,m=Math.hypot(s.vx,s.vy);
      s.vx=Math.cos(a)*m;s.vy=Math.sin(a)*m;}
    if(s.seek){const a=Math.atan2(P.y-s.y,P.x-s.x),m=Math.hypot(s.vx,s.vy);
      s.vx+=Math.cos(a)*m*s.seek*dt;s.vy+=Math.sin(a)*m*s.seek*dt;
      const nm=Math.hypot(s.vx,s.vy);s.vx=s.vx/nm*m;s.vy=s.vy/nm*m;}
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    if(s.life<=0||s.x<0||s.x>W||s.y<TOP||s.y>H||inWall(s.x,s.y,s.r)){B.eshots.splice(i,1);continue;}
    if(dist(s,P)<P.r+s.r){hurtPlayer(s.dmg);B.eshots.splice(i,1);}
  }

  /* laser beams */
  for(let i=B.beams.length-1;i>=0;i--){
    const b=B.beams[i];b.t+=dt;
    if(b.owner&&!b.owner.dead&&b.t<b.warn){
      b.x=b.owner.x;b.y=b.owner.y;
      const ta=Math.atan2(P.y-b.y,P.x-b.x);
      let df=((ta-b.a+Math.PI*3)%(Math.PI*2))-Math.PI;
      b.a+=df*Math.min(1,dt*1.6);
    }
    if(b.t>=b.warn&&!b.done){
      b.done=true;B.shake=Math.max(B.shake,5);
      const dx=P.x-b.x,dy=P.y-b.y;
      const along=dx*Math.cos(b.a)+dy*Math.sin(b.a);
      const perp=Math.abs(-dx*Math.sin(b.a)+dy*Math.cos(b.a));
      if(along>0&&perp<13+P.r)hurtPlayer(b.dmg);
      for(const e of B.enemies){if(e.dead||e===b.owner)continue;
        const ex=e.x-b.x,ey=e.y-b.y;
        const al=ex*Math.cos(b.a)+ey*Math.sin(b.a);
        const pe=Math.abs(-ex*Math.sin(b.a)+ey*Math.cos(b.a));
        if(al>0&&pe<13+e.r)hurtEnemy(e,b.dmg*.4,false,"aoe");}
    }
    if(b.t>b.warn+b.fire)B.beams.splice(i,1);
  }
  /* orbs */
  for(let i=B.orbs.length-1;i>=0;i--){
    const o=B.orbs[i];o.t+=dt;
    const near=dist(o,P)<74;
    if(o.t<.38){o.x+=o.vx*dt;o.y+=o.vy*dt;o.vy+=260*dt;
      o.vx*=(1-5*dt);o.vy*=(1-2*dt);
      o.x=clamp(o.x,12,W-12);o.y=clamp(o.y,TOP+12,H-12);}
    else if(B.collect||near){
      o.pull=(o.pull||0)+dt;
      const a=Math.atan2(P.y-o.y,P.x-o.x);
      const sp=90+o.pull*o.pull*900;
      o.x+=Math.cos(a)*sp*dt;o.y+=Math.sin(a)*sp*dt;
      if(o.xp&&Math.random()<dt*14)B.parts.push({x:o.x,y:o.y,vx:0,vy:0,
        l:.22,col:"#9FE1CB",s:2});
    }else{o.y+=Math.sin(B.t*3+o.x)*10*dt;}
    if(dist(o,P)<20){
      if(o.heart){heal(P.maxhp*0.12);say(P.x,P.y-30,"+HP","#F06A80",true);
        ring(P.x,P.y,50,"#F06A80");}
      else if(o.xp)gainXP(o.v);else B.gold+=Math.round(o.v*(1+P.bounty));
      B.parts.push({x:o.x,y:o.y,vx:0,vy:-40,l:.25,
        col:o.xp?"#9FE1CB":"#E8B04B",s:3});
      B.orbs.splice(i,1);
    }
  }
  for(let i=B.lasers.length-1;i>=0;i--){const L=B.lasers[i];L.l-=dt;
    if(L.l<=0)B.lasers.splice(i,1);}
  for(let i=B.corpses.length-1;i>=0;i--){const c=B.corpses[i];c.l-=dt;
    if(c.l<=0)B.corpses.splice(i,1);}
  for(let i=B.rings.length-1;i>=0;i--){const r=B.rings[i];r.l-=dt;
    r.r+=(r.max-r.r)*dt*11;if(r.l<=0)B.rings.splice(i,1);}
  for(let i=B.fires.length-1;i>=0;i--){const f=B.fires[i];f.l-=dt;
    if(f.l<=0){B.fires.splice(i,1);continue;}
    if(f.acid){
      if(!P.hazImmune&&dist(f,P)<f.r+P.r&&Math.random()<dt*2.4)hazTick(hazDmg()*.22);
    }else for(const e of B.enemies){if(!e.dead&&dist(f,e)<f.r+e.r&&Math.random()<dt*4){
      hurtEnemy(e,P.atk*0.22,false,"aoe");e.fire=Math.max(e.fire,1.2);}}}
  for(let i=B.parts.length-1;i>=0;i--){const p=B.parts[i];p.l-=dt;
    if(!p.arc){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=(1-2.6*dt);p.vy*=(1-2.6*dt);}
    if(p.l<=0)B.parts.splice(i,1);}
  for(let i=B.texts.length-1;i>=0;i--){const t=B.texts[i];t.l-=dt;t.y-=34*dt;
    if(t.l<=0)B.texts.splice(i,1);}

  if(B.angel){
    B.angel.t+=dt;
    if(!B.angel.taken&&dist(B.angel,P)<34){
      B.angel.taken=true;
      burst(B.angel.x,B.angel.y,"#E8B04B",34,240);
      ring(B.angel.x,B.angel.y,150,"#E8B04B");
      B.shake=Math.max(B.shake,5);
      showBoons(true);
    }
    return;
  }
  if(B.enemies.length===0){
    if(!B.collect){B.collect=true;B.shake=Math.max(B.shake,2);}
    B.clear+=dt;
    if(B.clear>.45&&B.orbs.length===0)roomDone();
    else if(B.clear>3.4)roomDone();
  }
}

  for(let i=0;i<3;i++){const a=rnd(0,6.283);
    B.shots.push({x,y,vx:Math.cos(a)*180,vy:Math.sin(a)*180,dmg,crit:false,
      r:4,life:1.4,kind:"mote",pierce:0,bounce:0,hit:[],t:0,home:3.4,tr:[]});}

function meteor(){
  let best=null,bn=0;
  for(const e of B.enemies){if(e.dead)continue;let n=0;
    for(const o of B.enemies)if(!o.dead&&dist(e,o)<60)n++;
    if(n>bn){bn=n;best=e;}}
  if(!best)return;
  const x=best.x,y=best.y;
  B.parts.push({x,y,vx:0,vy:0,l:.4,col:"#F04FA0",s:9});
  setTimeout(()=>{if(B.on&&P)explode(x,y,70,P.atk*1.6,"#F04FA0");},380);
}
/* Whisker steering. An enemy probes ahead along its desired heading and, if that
   is blocked, fans out to either side and commits to whichever way is clear. It
   remembers the side it picked so it doesn't oscillate in a doorway. */
function moveE(e,vx,vy,dt){
  const sp=Math.hypot(vx,vy);
  if(sp<1){e.x=clamp(e.x,e.r,W-e.r);e.y=clamp(e.y,TOP+e.r,H-e.r);return;}
  const base=Math.atan2(vy,vx);
  const look=e.r+16;
  e.side=e.side||0;
  const fans=[0,.45,-.45,.95,-.95,1.5,-1.5,2.1,-2.1,2.8,-2.8];
  if(e.side<0)fans.sort((a,b)=>(a<0?-1:1)-(b<0?-1:1));
  let chosen=null;
  for(const o of fans){
    const a=base+o;
    const px=e.x+Math.cos(a)*look, py=e.y+Math.sin(a)*look;
    if(inWall(px,py,e.r*0.72))continue;
    if(px<e.r||px>W-e.r||py<TOP+e.r||py>H-e.r)continue;
    chosen=a;
    if(Math.abs(o)>0.3)e.side=o>0?1:-1;else e.side=0;
    break;
  }
  if(chosen===null)chosen=base+Math.PI*0.5*(e.side||1);
  /* ease the turn so movement reads as smooth rather than snapping */
  if(e.hdg===undefined)e.hdg=chosen;
  let d=((chosen-e.hdg+Math.PI*3)%(Math.PI*2))-Math.PI;
  e.hdg+=d*Math.min(1,dt*9);
  const nx=e.x+Math.cos(e.hdg)*sp*dt, ny=e.y+Math.sin(e.hdg)*sp*dt;
  if(!inWall(nx,e.y,e.r))e.x=nx;
  if(!inWall(e.x,ny,e.r))e.y=ny;
  e.x=clamp(e.x,e.r,W-e.r);e.y=clamp(e.y,TOP+e.r,H-e.r);
  /* stuck detector: if it has barely moved while trying to, commit to a side */
  e.lastX=e.lastX===undefined?e.x:e.lastX;e.lastY=e.lastY===undefined?e.y:e.lastY;
  e.stuckT=(e.stuckT||0)+dt;
  if(e.stuckT>0.5){
    if(Math.hypot(e.x-e.lastX,e.y-e.lastY)<6){e.side=Math.random()<.5?1:-1;e.hdg=base+1.6*e.side;}
    e.stuckT=0;e.lastX=e.x;e.lastY=e.y;
  }
}
function eshoot(e,a,sp,dmg,opt){
  const s={x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:4.6,dmg,life:4.5,
    kind:"bolt",spin:0,t:0};
  if(opt)Object.assign(s,opt);
  B.eshots.push(s);return s;
}
/* Leads the shot so standing still is not a free pass. */
function aimAt(e,speed,lead){
  const px=P.x+(P.vx||0)*(lead||0), py=P.y+(P.vy||0)*(lead||0);
  return Math.atan2(py-e.y,px-e.x);
}
/* --- attack: thrown axe. Flies out, arcs back to the thrower. --- */
function throwAxe(e,a,dmg){
  eshoot(e,a,190,dmg,{kind:"axe",r:9,life:2.6,owner:e,out:true,spin:0,hitT:0});
}
/* --- attack: tornado. Slow, tracks you, shoves you, expires. --- */
function tornado(e,a,dmg){
  eshoot(e,a,74,dmg,{kind:"tornado",r:16,life:5.2,seek:0.9,hitT:0});
}
/* --- attack: lobbed glob. Telegraphed landing, leaves a pool. --- */
function lob(e,dmg){
  const x=clamp(P.x+rnd(-16,16),20,W-20), y=clamp(P.y+rnd(-16,16),TOP+20,H-20);
  eshoot(e,Math.atan2(y-e.y,x-e.x),0,0,{kind:"lobshadow",life:0.95,r:2,dmg:0});
  telegraph(x,y,30,0.95,"#8FBF6A",()=>{
    explode(x,y,36,dmg,"#8FBF6A");
    if(dist({x,y},P)<40)hurtPlayer(dmg);
    B.fires.push({x,y,l:2.6,r:22,acid:1});
  });
}
/* --- attack: laser. Warns along a line, then fires. --- */
function beam(e,a,dmg,warn){
  B.beams.push({owner:e,x:e.x,y:e.y,a,t:0,warn:warn||0.75,fire:0.32,dmg,done:false});
}
/* --- attack: ground slam around the enemy --- */
function slam(e,r,dmg){
  const x=e.x,y=e.y;
  telegraph(x,y,r,0.65,e.col,()=>{
    explode(x,y,r,dmg*0.6,e.col);
    if(dist({x,y},P)<r+P.r)hurtPlayer(dmg);
    B.shake=Math.max(B.shake,7);
  });
}
function bossAI(b,dt,ux,uy,d,sf){
  b.cool-=dt*sf;
  if(b.charge>0){b.charge-=dt;moveE(b,b.vx,b.vy,dt);
    if(b.x<=b.r+1||b.x>=W-b.r-1)b.vx*=-1;
    if(b.y<=TOP+b.r+1||b.y>=H-b.r-1)b.vy*=-1;return;}
  moveE(b,ux*b.spd*.5*sf,uy*b.spd*.5*sf,dt);
  if(b.cool<=0){
    const hurt=b.hp<b.maxhp*.5;
    const mode=ri(0,hurt?3:1);
    if(mode===0){const n=hurt?16:11,o=rnd(0,1);
      for(let i=0;i<n;i++)eshoot(b,(i+o)/n*6.283,145,b.dmg*.5);
      b.cool=2.1;burst(b.x,b.y,b.col,14,140);}
    else if(mode===1){const base=Math.atan2(P.y-b.y,P.x-b.x);
      for(let k=-2;k<=2;k++)eshoot(b,base+k*.15,215,b.dmg*.55);b.cool=1.5;}
    else if(mode===2){const a=Math.atan2(P.y-b.y,P.x-b.x);
      b.vx=Math.cos(a)*320;b.vy=Math.sin(a)*320;b.charge=1.15;b.cool=2.5;
      say(b.x,b.y-44,"CHARGE",b.col,true);}
    else{for(let i=0;i<(b.mega?3:2);i++)spawn("chaser");b.cool=3;
      say(b.x,b.y-44,"SUMMON",b.col,true);}
  }
}

/* --- flow --- */
function roomDone(){
  B.clear=0;
  if(P.regen>0)heal(P.maxhp*P.regen);
  if(P.roomHeal)heal(P.roomHeal);
  if(P.barrierMax)P.barrier=P.barrierMax;
  if(P.roomGuard)P.guard=1;
  if(B.pendingFind){B.pendingFind=null;save();markTabs();}
  if(B.mode==='rush'&&B.room<B.rooms)P.pending=1;
  if(P.pending>0&&B.room<B.rooms){P.pending--;showBoons();return;}
  advanceRoom();
}
function advanceRoom(){
  if(B.room>=B.rooms){finish(true);return;}
  B.paused=false;B.room++;genRoom();saveNow();
}
